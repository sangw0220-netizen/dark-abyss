<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DARK ABYSS : AI CHRONICLES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TOWN 여백 강제 축소 (최상위 우선순위 적용)
===================================================================== */
body #app .town-hub .town-location .town-status-wrap {
  margin-bottom: 14px !important;
}

body #app .town-hub .town-location .town-meta {
  margin-top: 0 !important; /* 하단으로 칩을 강제로 밀어내는 auto 속성 완벽 차단 */
}  
:root{
  --bg:#100a06;
  --bg-glow:#2a1a0c;
  --wood:#2c1c10;
  --wood-light:#4a3018;
  --wood-lighter:#6b4726;
  --panel:#241708;
  --panel-alt:#1c1207;
  --panel-soft:#3a2712;
  --parchment:#ecd9ab;
  --parchment-dim:#dcc48c;
  --ink:#3a2812;
  --ink-soft:#6e5732;
  --gold:#d9b45c;
  --gold-bright:#f4dd97;
  --gold-dim:#7a5c26;
  --bronze:#a97a3a;
  --text:#ecdcb4;
  --text-dim:#a4906a;
  --red:#b5323f;
  --red-bright:#e0616c;
  --gold-alt:#e0b83e;
  --blue:#3f6f9e;
  --green:#4f7a45;
  --purple:#8c6fae;
  --hp:#8f2430;
  --mp:#2d5478;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% -10%, var(--bg-glow) 0%, var(--bg) 60%),
    repeating-linear-gradient(115deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 2px, transparent 2px, transparent 5px),
    var(--bg);
  color:var(--text);
  font-family:'Noto Serif KR','Cinzel',serif;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:820px;
  margin:0 auto;
  height:100%;
  display:flex;
  flex-direction:column;
  padding:14px 14px 20px;
  gap:10px;
}

/* ---------- title bar ---------- */
#titlebar{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:4px 6px 12px;
  border-bottom:1px solid var(--gold-dim);
  position:relative;
  flex-shrink: 0;
}
#titlebar::after{
  content:"◆";
  position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  color:var(--gold);font-size:10px;background:var(--bg);padding:0 8px;
}
#titlebar h1{
  font-family:'Cinzel Decorative','Cinzel',serif;
  font-weight:900;
  font-size:26px;margin:0;
  letter-spacing:3px;
  background:linear-gradient(180deg,var(--gold-bright) 10%,var(--gold) 55%,var(--bronze) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 0 rgba(0,0,0,0.55), 0 0 18px rgba(217,180,92,0.25);
}
#titlebar .sub{
  font-family:'Cinzel',serif;
  font-size:9px;color:var(--text-dim);margin-top:4px;letter-spacing:3px;text-transform:uppercase;
}
.ctrl-col{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.ctrl-row{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--text-dim);font-family:'Cinzel',serif;letter-spacing:1px;}
.mini-btn{
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--wood-lighter),var(--wood));
  border:1px solid var(--gold-dim);border-radius:2px;
  color:var(--gold-bright);cursor:pointer;font-size:11px;user-select:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
}
.mini-btn:hover{border-color:var(--gold);background:linear-gradient(180deg,#7a5228,#4a3018);}
.mini-btn:active{transform:translateY(1px);}
.mini-btn.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,180,92,.28), inset 0 1px 0 rgba(255,255,255,.12);}


/* ---------- ornate frame ---------- */
.frame{
  position:relative;
  background:linear-gradient(155deg,var(--gold) 0%,var(--gold-dim) 45%,var(--bronze) 100%);
  padding:4px;
  border-radius:3px;
  box-shadow:0 3px 10px rgba(0,0,0,0.45);
}
.frame.hot{background:linear-gradient(155deg,var(--gold-bright) 0%,var(--gold) 45%,#c98f2e 100%);}
.frame::after{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 7px 7px, var(--gold-bright) 0 1.6px, rgba(0,0,0,0.35) 1.6px 2.4px, transparent 3px),
    radial-gradient(circle at calc(100% - 7px) 7px, var(--gold-bright) 0 1.6px, rgba(0,0,0,0.35) 1.6px 2.4px, transparent 3px),
    radial-gradient(circle at 7px calc(100% - 7px), var(--gold-bright) 0 1.6px, rgba(0,0,0,0.35) 1.6px 2.4px, transparent 3px),
    radial-gradient(circle at calc(100% - 7px) calc(100% - 7px), var(--gold-bright) 0 1.6px, rgba(0,0,0,0.35) 1.6px 2.4px, transparent 3px);
}
.frame-inner{
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.10) 0 2px, transparent 2px 26px),
    linear-gradient(180deg,var(--panel),var(--panel-alt));
  border:1px solid #000;
  border-radius:1px;
  padding:10px 12px;
  position:relative;
}
.frame-inner.tight{padding:8px 10px;}

/* ---------- scene (non-battle summary) ---------- */
#scene{font-size:12px; flex-shrink: 0;}
.hud-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;}
.hud-name{color:var(--text);font-weight:normal;}
.hud-name b{color:var(--gold-bright);font-family:'Cinzel',serif;}
.hud-gold{color:var(--gold);font-family:'Cinzel',serif;font-size:11px;}
.bar-line{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10px;}
.bar-label{width:30px;flex-shrink:0;font-family:'Cinzel',serif;letter-spacing:1px;}
.bar-label.hp{color:var(--red-bright);}
.bar-label.hp::before{content:"♥ ";}
.bar-label.mp{color:#7ec2f0;}
.bar-label.mp::before{content:"✦ ";}
.bar-track{
  flex:1;height:13px;background:#150d06;border:1px solid #000;
  outline:1px solid var(--gold-dim);border-radius:7px;
  position:relative;overflow:hidden;
}
.bar-fill{height:100%;transition:width .35s ease-out;border-radius:7px;}
.bar-fill.hp{background:linear-gradient(180deg,var(--red-bright),var(--hp) 55%,#5a1119);}
.bar-fill.mp{background:linear-gradient(180deg,#7ec2f0,var(--mp) 55%,#173650);}
.bar-fill::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0.28) 0%, transparent 35%);
}
.bar-num{width:78px;text-align:right;flex-shrink:0;color:var(--text);font-size:9px;font-family:'Cinzel',serif;}
.mini-turn-meter{margin-top:5px;}
.mini-turn-track{width:100%;height:7px;background:#120d09;border:1px solid rgba(0,0,0,.75);border-radius:6px;overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);}
.mini-turn-fill{height:100%;width:0;min-width:2px;background:linear-gradient(180deg,#fff3a8,#f4c748 52%,#bb7d12);border-radius:6px;transition:width .3s ease-out;box-shadow:inset 0 1px 0 rgba(255,255,255,.45);}
.mini-turn-fill.ready{background:linear-gradient(180deg,#fff8c9,#f9d861 52%,#d99d19);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 0 8px rgba(249,216,97,.6);}
.hud-stats{margin-top:6px;font-size:10px;color:var(--text);display:flex;gap:8px;flex-wrap:wrap;}
.hud-stats span{
  background:var(--panel-soft);border:1px solid var(--gold-dim);border-radius:3px;
  padding:2px 6px;font-family:'Cinzel',serif;color:var(--gold);
}
.hud-equip{margin-top:6px;font-size:9px;color:var(--text-dim);letter-spacing:0.5px;}

/* ---------- lobby HUD spacing / equipment ---------- */
.lobby-hud{
  padding:12px 10px 13px !important;
}
.lobby-hud .hud-row{
  margin-bottom:9px;
}
.lobby-hud .bar-line{
  margin-top:8px;
}
.lobby-hud .hud-stats{
  margin-top:10px;
  gap:7px;
}
.lobby-hud .hud-stats span{
  padding:3px 7px;
}
.lobby-hud .hud-equip{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  color:var(--text);
  letter-spacing:0;
}
.lobby-hud .hud-equip span{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:3px 8px;
  background:var(--panel-soft);
  border:1px solid var(--gold-dim);
  border-radius:3px;
  font-family:'Cinzel',serif;
  font-size:9px;
  color:var(--gold);
}

/* ===== MOBILE OPTIMIZATION: Lobby HUD ===== */
@media(max-width:768px){
  .lobby-hud{
    padding:6px 6px 7px !important;
  }
  .hud-row{
    gap:3px;
  }
  .lobby-hud .hud-row{
    margin-bottom:4px;
  }
  .hud-name{
    font-size:11px;
  }
  .hud-name b{
    font-size:10px;
  }
  .hud-gold{
    font-size:9px;
  }
  .bar-line{
    gap:4px;
    margin-top:3px;
    font-size:9px;
  }
  .bar-label{
    width:26px;
    font-size:8px;
  }
  .bar-track{
    height:10px;
  }
  .bar-num{
    width:60px;
    font-size:8px;
  }
  .mini-turn-meter{
    margin-top:3px;
  }
  .mini-turn-track{
    height:5px;
  }
  .lobby-hud .bar-line{
    margin-top:3px;
  }
  .lobby-hud .hud-stats{
    margin-top:5px;
    gap:4px;
  }
  .lobby-hud .hud-stats span{
    padding:2px 5px;
    font-size:8px;
  }
  .lobby-hud .hud-equip{
    margin-top:5px;
    gap:4px;
  }
  .lobby-hud .hud-equip span{
    min-height:18px;
    padding:2px 5px;
    font-size:7px;
  }
}

/* ---------- battle scene ---------- */
.battle-top{font-size:11px;}
.vs-wrap{display:flex;align-items:stretch;gap:8px;margin-top:8px;}
.combatant-card{
  flex:1;background:radial-gradient(ellipse at 50% 30%, var(--wood-light) 0%, var(--panel-alt) 75%);
  border:1px solid #000;outline:2px solid;border-radius:4px;
  padding:9px 8px;position:relative;min-width:0;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.combatant-card.player{outline-color:var(--mp);}
.combatant-card.enemy{outline-color:var(--hp);}
.combatant-card .tag{
  font-size:8px;letter-spacing:2px;color:var(--text-dim);align-self:flex-start;
  font-family:'Cinzel',serif;text-transform:uppercase;
}
.combatant-card.player .tag{color:#7ec2f0;}
.combatant-card.enemy .tag{color:var(--red-bright);}
.sprite-box{
  width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin:4px 0;
  border-radius:50%;background:radial-gradient(circle,#000 0%,var(--panel-alt) 70%);
  border:2px solid var(--gold-dim);box-shadow:0 0 0 1px #000, inset 0 0 10px rgba(0,0,0,0.6);
  overflow:hidden;
}
.combatant-card .cname{font-size:11px;color:var(--gold-bright);font-family:'Cinzel',serif;}
.combatant-card .cjob{font-size:9px;color:var(--text-dim);margin-bottom:4px;}
.mini-bar-track{width:100%;height:10px;background:#150d06;border:1px solid #000;border-radius:5px;position:relative;overflow:hidden;outline:1px solid var(--gold-dim);}
.mini-bar-fill{height:100%;}
.mini-bar-fill.hp{background:linear-gradient(180deg,var(--red-bright),var(--hp) 55%,#5a1119);}
.mini-hp-num{font-size:9px;margin-top:3px;color:var(--text-dim);}
.vs-badge{
  flex-shrink:0;width:44px;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--gold);text-shadow:0 0 10px rgba(217,180,92,0.6), 0 2px 0 #000;
}
.flash-red{animation:flashred .3s steps(2);}
@keyframes flashred{0%,100%{background:var(--panel-alt);}50%{background:#5a1a22;}}
.charge-warn{margin-top:8px;font-size:10px;color:var(--red-bright);text-align:center;font-family:'Cinzel',serif;}
.enemy-info{margin-top:8px;font-size:10px;color:var(--gold);text-align:center;}

.enemy-group{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;justify-content:center;}
.enemy-card{position:relative;transition:outline-color .15s, box-shadow .15s, opacity .15s;}
.enemy-card.dead{opacity:0.35;filter:grayscale(0.85);}
.enemy-card.targeted{outline-color:var(--gold-bright)!important;box-shadow:0 0 8px rgba(217,180,92,0.65);}
.enemy-card.multi{
  padding:5px 7px 5px 7px;display:flex;align-items:center;gap:7px;text-align:left;
  background:radial-gradient(ellipse at 50% 30%, var(--wood-light) 0%, var(--panel-alt) 75%);
  border:1px solid #000;outline:2px solid var(--hp);border-radius:4px;
}
.enemy-card.multi:not(.dead){cursor:pointer;}
.enemy-card .esprite{
  width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:radial-gradient(circle,#000 0%,var(--panel-alt) 70%);
  border:2px solid var(--gold-dim);font-size:18px;overflow:hidden;
}
.enemy-card .einfo{flex:1;min-width:0;}
.enemy-card .ename{font-size:10px;color:var(--gold-bright);font-family:'Cinzel',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.enemy-card .etag{font-size:8px;color:var(--text-dim);margin-bottom:2px;}
.enemy-card .target-mark{position:absolute;top:-7px;right:-6px;font-size:12px;filter:drop-shadow(0 1px 1px #000);}
.target-hint{margin-top:8px;font-size:9px;color:var(--gold);text-align:center;opacity:0.9;}

/* Battle state indicators */
.state-badge{
  display:inline-block;margin-top:6px;padding:3px 6px;
  font-size:8px;font-family:'Cinzel',serif;font-weight:700;letter-spacing:0.5px;
  border-radius:3px;border:1px solid;text-shadow:0 1px 0 rgba(0,0,0,0.5);
  white-space:nowrap;
}
.state-badge.ultimate-prep{
  background:#6b4c1f;border-color:#8a5a12;color:#ffe082;
}
.state-badge.ultimate-ready{
  background:#8e3329;border-color:#c4493a;color:#ffcccc;
  animation:readypulse 0.8s ease-in-out infinite;
}
.state-badge.defending{
  background:#2d5478;border-color:#5b8bc4;color:#a8d8ff;
}

@keyframes readypulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.75;transform:scale(1.05);}
}

/* Card state animations */
.combatant-card.ultimate-prep-state{
  outline-color:#ffe082!important;
  animation:ultimateprepborder 1.2s ease-in-out infinite;
}
.enemy-card.ultimate-prep-state{
  outline-color:#ffe082!important;
  animation:ultimateprepborder 1.2s ease-in-out infinite;
}

.combatant-card.ultimate-ready-state{
  outline-color:#ff6b6b!important;
  animation:ultimatereadyborder 0.6s ease-in-out infinite;
  box-shadow:0 0 12px rgba(255, 107, 107, 0.6);
}
.enemy-card.ultimate-ready-state{
  outline-color:#ff6b6b!important;
  animation:ultimatereadyborder 0.6s ease-in-out infinite;
  box-shadow:0 0 12px rgba(255, 107, 107, 0.6);
}

.combatant-card.defending-state{
  outline-color:#5b8bc4!important;
  animation:defendingborder 0.8s ease-in-out infinite;
}
.enemy-card.defending-state{
  outline-color:#5b8bc4!important;
  animation:defendingborder 0.8s ease-in-out infinite;
}

@keyframes ultimateprepborder{
  0%,100%{outline-color:#ffe082;}
  50%{outline-color:#ffd700;}
}

@keyframes ultimatereadyborder{
  0%,100%{outline-color:#ff6b6b;box-shadow:0 0 12px rgba(255, 107, 107, 0.6);}
  50%{outline-color:#ff9999;box-shadow:0 0 18px rgba(255, 107, 107, 0.9);}
}

@keyframes defendingborder{
  0%,100%{outline-color:#5b8bc4;}
  50%{outline-color:#7ec2f0;}
}

/* shake */
.shake{animation:shakeit .38s linear;}
@keyframes shakeit{
  10%{transform:translate(-6px,3px);}20%{transform:translate(5px,-4px);}
  30%{transform:translate(-4px,4px);}40%{transform:translate(6px,-3px);}
  50%{transform:translate(-5px,2px);}60%{transform:translate(4px,-4px);}
  70%{transform:translate(-3px,3px);}80%{transform:translate(3px,-2px);}
  90%{transform:translate(-2px,1px);}100%{transform:translate(0,0);}
}
.pop{animation:popit .28s ease-out;}
@keyframes popit{0%{transform:scale(1);}40%{transform:scale(1.03);}100%{transform:scale(1);}}
.crit-flash{animation:critflash .28s steps(2) 2;}
@keyframes critflash{0%,100%{filter:none;}50%{filter:brightness(2.2) sepia(0.2);}}
.gold-flash{animation:goldflash .3s steps(2) 2;}
@keyframes goldflash{0%,100%{box-shadow:none;}50%{box-shadow:inset 0 0 0 4px var(--gold);}}
.cyan-flash{animation:cyanflash .25s steps(2) 1;}
@keyframes cyanflash{0%,100%{box-shadow:none;}50%{box-shadow:inset 0 0 0 4px #7ec2f0;}}

/* ---------- log (parchment page) ---------- */
#logWrap{flex:1;display:flex;min-height:0;}
#logFrame{flex:1;display:flex;}
#logFrame .frame-inner{
  background:
    radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.10), transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(0,0,0,0.12), transparent 55%),
    linear-gradient(175deg, var(--parchment) 0%, var(--parchment-dim) 100%);
  border:1px solid #000;
}
#log{
  flex:1;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
  padding:6px 4px;line-height:1.75;font-size:13px;color:var(--ink);
}
#log::-webkit-scrollbar{width:8px;}
#log::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:4px;}
#log::-webkit-scrollbar-track{background:rgba(0,0,0,0.08);}
.ln{display:block;}
.c-red{color:var(--hp);}
.c-gold{color:#8a5a12;font-weight:600;}
.c-blue{color:#2a4f75;}
.c-green{color:#3d5d33;}
.c-strong{color:#1c1206;font-weight:bold;}

/* ---------- town hub dashboard ---------- */
/* ---------- town hub : compact / readable layout ---------- */
.town-hub{display:flex;flex-direction:column;gap:9px;color:var(--ink);padding:0;}
.town-hero{display:grid;grid-template-columns:1.25fr .75fr;gap:10px;align-items:start;}
.town-location{position:relative;overflow:hidden;padding:12px 15px;border:1px solid rgba(58,40,18,.35);background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(122,92,38,.08));height:auto;min-height:0;}
.town-location::after{content:"✦";position:absolute;right:16px;top:7px;font-size:38px;color:rgba(138,90,18,.12);}
.town-kicker{font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:var(--ink-soft);margin-bottom:3px;text-transform:uppercase;}
.town-title{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:900;color:#3a2812;margin:0 0 5px;}
.town-title span{font-family:'Cinzel',serif;font-size:10px;font-weight:600;color:#8a5a12;letter-spacing:2px;margin-left:6px;}
.town-desc{font-size:11px;line-height:1.65;margin:0;color:#4d371b;max-width:94%;}
.town-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.town-chip{padding:3px 7px;border:1px solid rgba(138,90,18,.35);background:rgba(255,255,255,.18);font-family:'Cinzel',serif;font-size:8px;color:#6e4b18;border-radius:2px;}
.town-notice{padding:11px 13px;border:1px solid rgba(58,40,18,.35);background:rgba(58,40,18,.055);display:flex;flex-direction:column;justify-content:flex-start;height:auto;min-height:0;}
.town-notice .label{font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;color:#8a5a12;margin-bottom:6px;}
.town-notice strong{font-size:12px;line-height:1.5;color:#3a2812;}
.town-notice small{margin-top:6px;font-size:9px;color:#6e5732;line-height:1.5;}
.town-section{border-top:1px solid rgba(58,40,18,.28);padding-top:3px;margin-top:2px;}
.town-section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.town-section-title{font-weight:800;font-size:12px;color:#3a2812;}
.town-section-sub{font-family:'Cinzel',serif;font-size:8px;letter-spacing:1px;color:#8a5a12;}
.town-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.town-card{padding:5px;border:1px solid rgba(58,40,18,.26);background:rgba(255,255,255,.13);min-height:50px;}

/* ---------- action buttons ---------- */
#actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px; flex-shrink: 0;}
.action-btn{
  background:linear-gradient(180deg,var(--wood-lighter) 0%,var(--wood) 60%,var(--panel-alt) 100%);
  border:1px solid #000;outline:1px solid var(--gold-dim);border-radius:4px;
  color:var(--gold-bright);padding:11px 6px;font-family:'Cinzel',serif;font-size:12px;cursor:pointer;
  letter-spacing:0.5px;text-align:center;min-height:46px;display:flex;align-items:center;justify-content:center;
  line-height:1.3;box-shadow:inset 0 1px 0 rgba(255,255,255,0.10), 0 2px 4px rgba(0,0,0,0.4);
  transition:background .15s, outline-color .15s;
}
.action-btn:hover{outline-color:var(--gold);background:linear-gradient(180deg,#84592c,#4a3018 60%,var(--panel-alt) 100%);}
.action-btn:active{transform:translateY(2px);box-shadow:inset 0 1px 4px rgba(0,0,0,0.5);}
.action-btn.empty{visibility:hidden;pointer-events:none;}
.action-btn.danger{outline-color:var(--red-bright);color:#f0b8bc;}
.action-btn.danger:hover{background:linear-gradient(180deg,#6b2530,#3a1015 60%,var(--panel-alt) 100%);}

/* ---------- modal ---------- */
#modalRoot{
  position:fixed;inset:0;background:rgba(8,5,2,0.82);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
#modalRoot.show{display:flex;}
.modal-box{width:100%;max-width:360px;}
.modal-title{
  font-family:'Cinzel',serif;font-size:13px;color:var(--gold-bright);margin-bottom:12px;
  text-align:center;letter-spacing:1px;text-shadow:0 1px 0 #000;
}
.modal-input{
  width:100%;background:var(--parchment);border:1px solid #000;outline:1px solid var(--gold-dim);
  color:var(--ink);font-family:'Noto Serif KR',serif;font-size:13px;padding:9px;margin-bottom:10px;
  border-radius:2px;
}
.modal-actions{display:flex;gap:8px;}
.modal-actions .action-btn{flex:1;min-height:38px;}

/* particles & loader */
.particle-layer{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.p-square{position:absolute;width:6px;height:6px;opacity:0.95;transform:rotate(45deg);}
@keyframes pfly{
  0%{transform:translate(0,0) scale(1) rotate(45deg);opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) scale(0.4) rotate(45deg);opacity:0;}
}
.toast{
  position:fixed;left:50%;top:16px;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--wood-lighter),var(--wood));
  border:1px solid #000;outline:2px solid var(--gold);border-radius:3px;
  color:var(--gold-bright);padding:10px 18px;font-size:11px;z-index:80;font-family:'Cinzel',serif;letter-spacing:0.5px;
  opacity:0;transition:opacity .25s;pointer-events:none;
  box-shadow:0 4px 14px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;}
.loader-overlay {
  position:absolute;inset:0;background:rgba(0,0,0,0.7);z-index:40;
  display:none;align-items:center;justify-content:center;color:var(--gold);font-family:'Cinzel',serif;font-size:14px;
}
.loader-overlay.show{display:flex;}
.spinner {
  width:24px;height:24px;border:3px solid transparent;border-top-color:var(--gold);border-radius:50%;
  animation:spin 1s linear infinite;margin-right:10px;
}
@keyframes spin { 100%{transform:rotate(360deg);} }

<style id="mobile-final-redesign">
/* =====================================================================
   MOBILE FINAL REDESIGN
   위의 여러 겹 모바일 패치들이 서로 충돌하며 "한 화면에 욱여넣기" 위해
   글자를 6~9px까지 줄이고, 설명 텍스트에 불필요한 max-width(72~80%)를
   걸어 화면 폭 대비 글자가 좁은 단으로 눌려 보이던 문제를 해결합니다.

   규칙에서 후순위 규칙이 승리) 위의 모든 충돌 규칙을 안전하게 덮어씁니다.
   원칙: 억지로 한 화면에 안 맞추고, 세로 스크롤을 허용하는 대신
   글자 크기와 여백은 실제 손가락/눈으로 편안한 수준을 유지합니다.

function getRumorEvent(stageIdx=S.stageIdx){
  const pack=aiStagePack(stageIdx);
  if(pack?.rumor){
    return {...pack.rumor, type:"normal", need:3, questKey:"hunt"};
  }
  return RUMOR_EVENTS[stageIdx] || null;
}
function ensureRumorState(){
  const p=S.player;
  if(!p) return;
  if(!p.rumors) p.rumors={};
  for(let i=0;i<RUMOR_EVENTS.length;i++){
    if(!p.rumors[i]) p.rumors[i]={status:"new"};
  }
}
function getRumorState(stageIdx=S.stageIdx){
  ensureRumorState();
  return S.player?.rumors?.[stageIdx] || {status:"new"};
}
function rumorQuestDef(stageIdx=S.stageIdx){
  const ev=getRumorEvent(stageIdx);
  if(!ev) return null;
  return questDefs(stageIdx).find(q=>q.id===`S${stageIdx+1}_${ev.questKey}`) || null;
}

const QUEST_TEMPLATES = [
  {key:"hunt", icon:"⚔️", title:"주변의 위협", type:"normal", need:3,
   desc:(stageName)=>`${stageName} 주변에 출몰하는 몬스터를 처치하세요.`},
  {key:"elite", icon:"💀", title:"위험한 사냥감", type:"elite", need:1,
   desc:(stageName)=>`${stageName}의 정예 몬스터를 처치하고 주민들을 안심시키세요.`},
  {key:"boss", icon:"🔥", title:"지역의 지배자", type:"boss", need:1,
   desc:(stageName)=>`${stageName}을(를) 지배하는 보스를 쓰러뜨려 다음 지역의 길을 여세요.`}
];

function questDefs(stageIdx=S.stageIdx){
  const [stageName,,,bossList]=STAGE_DATA[stageIdx]||["미지의 지역",[],[],["미지의 보스"]];
  const s=stageIdx+1;
  const pack=aiStagePack(stageIdx);
  if(pack?.quests?.length){
    return pack.quests.map(q=>({
      id:`S${s}_${q.type}`,
      stage:stageIdx,
      icon:q.type==="normal"?"⚔️":q.type==="elite"?"💀":"🔥",
      title:`${q.title} · ${stageName}`,
      desc:q.desc,
      type:q.type,
      target:q.target || (q.type==="boss"?bossList[0]:null),
      need:q.need,
      rumorLinked:!!q.rumorLinked,
      reward:q.reward || rewardForQuestType(stageIdx,q.type)
    }));
  }
  const rumor=getRumorEvent(stageIdx);
  return QUEST_TEMPLATES.map(t=>{
    const linked=rumor&&rumor.questKey===t.key?rumor:null;
    return {
      id:`S${s}_${t.key}`,stage:stageIdx,icon:t.icon,
      title:linked?`${linked.title} · ${stageName}`:`${t.title} · ${stageName}`,
      desc:linked?linked.objective:t.desc(stageName),type:t.type,
      target:linked?linked.target:(t.type==="boss"?bossList[0]:null),
      need:linked?linked.need:t.need,rumorLinked:!!linked,
      reward:rewardForQuestType(stageIdx,t.type)
    };
  });
}

function ensureQuestState(){
  const p=S.player;
  if(!p) return;
  if(!p.quests) p.quests={};
  questDefs().forEach(q=>{
    if(!p.quests[q.id]) p.quests[q.id]={status:"available",progress:0};
  });
}

function allQuestDefs(){
  const list=[];
  for(let i=0;i<STAGE_DATA.length;i++) list.push(...questDefs(i));
  return list;
}

function getQuestState(q){
  ensureQuestState();
  return S.player.quests[q.id] || {status:"available",progress:0};
}

function questRewardText(r){
  return `✨ ${r.exp} EXP  ·  💰 ${r.gold}G  ·  🧪 소형 포션 ${r.potions}개`;
}

function questMenu(){
  setButtons([]);
  clearBattle();
  renderScene();
  ensureQuestState();
  const p=S.player;
  const defs=allQuestDefs().filter(q=>q.stage<=S.stageIdx);
  const active=defs.filter(q=>getQuestState(q).status==="active").length;
  const current=defs.filter(q=>q.stage===S.stageIdx);

  let html=`<div class="quest-board">
    <div class="quest-head">
      <div><div class="quest-kicker">ADVENTURER'S GUILD · QUEST BOARD</div><div class="quest-title">📜 의뢰 게시판</div></div>
      <div class="quest-count">진행 중 ${active}/3</div>
    </div>`;

  if(current.length){
    html += `<div style="font-size:11px;color:#9ca8b8;margin-top:2px;">현재 지역 의뢰</div>`;
    current.forEach(q=>{ html+=renderQuestCard(q); });
  }

  const pastCompleted=defs.filter(q=>q.stage<S.stageIdx && getQuestState(q).status==="claimed");
  if(pastCompleted.length){
    html += `<div style="font-size:11px;color:#9ca8b8;margin-top:5px;">완료한 의뢰 ${pastCompleted.length}건</div>`;
  }
  html += `</div>`;
  logEl().innerHTML=html;
  logEl().scrollTop=0;

  const btns=[];
  current.forEach(q=>{
    const st=getQuestState(q);
    if(st.status==="available") btns.push([`📜 수주: ${q.title.split(" · ")[0]}`,()=>acceptQuest(q.id)]);
    else if(st.status==="complete") btns.push([`🎁 보상 수령: ${q.title.split(" · ")[0]}`,()=>claimQuest(q.id)]);
  });
  btns.push(["🏡 마을로 돌아가기",town]);
  setPaginatedButtons(btns);
}

function renderQuestCard(q){
  const st=getQuestState(q);
  const progress=Math.min(q.need,st.progress||0);
  const pct=Math.floor(progress/q.need*100);
  let status="미수주", cls="";
  if(st.status==="active"){status="진행 중";cls="active";}
  if(st.status==="complete"){status="보상 대기";cls="complete";}
  if(st.status==="claimed"){status="완료";cls="complete";}
  return `<div class="quest-card ${cls}">
    <div class="quest-row"><div class="quest-icon">${q.icon}</div><div class="quest-main">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;"><div class="quest-name">${q.title}</div><span class="quest-status ${cls}">${status}</span></div>
      <div class="quest-desc">${q.desc}</div>
      <div class="quest-progress"><span style="width:${pct}%"></span></div>
      <div class="quest-progress-text"><span>진행도</span><b>${progress} / ${q.need}</b></div>
      <div class="quest-reward">보상 · ${questRewardText(q.reward)}${q.rumorLinked ? ` · 📜 마을 소식에서 발견` : ""}</div>
    </div></div></div>`;
}

function acceptQuest(id){
  ensureQuestState();
  const p=S.player;
  const active=Object.values(p.quests).filter(q=>q.status==="active").length;
  if(active>=3){ displayText("⚠️ 동시에 진행할 수 있는 의뢰는 최대 3개입니다."); return; }
  const q=allQuestDefs().find(x=>x.id===id);
  if(!q) return;
  p.quests[id]={status:"active",progress:0};
  autoSave();
  displayText(`📜 [${q.title}] 의뢰를 수주했습니다.`,{highlight:true});
  questMenu();
}

function updateQuestProgress(m){
  ensureQuestState();
  const defs=allQuestDefs();
  const p=S.player;
  let changed=false;
  defs.forEach(q=>{
    const st=p.quests[q.id];
    if(!st || st.status!=="active" || q.stage!==S.stageIdx) return;
    let match=false;
    if(q.type==="normal") match=m.m_type==="일반";
    else if(q.type==="elite") match=m.m_type==="중간보스";
    else if(q.type==="boss") match=m.m_type==="보스" && m.name===q.target;
    if(match && q.rumorLinked && q.target) match = m.name===q.target;
    if(match){
      st.progress=Math.min(q.need,(st.progress||0)+1);
      changed=true;
      if(st.progress>=q.need){
        st.status="complete";
        if(q.rumorLinked && p.rumors) p.rumors[q.stage]={status:"complete"};
      }
    }
  });
  if(changed) autoSave();
  return changed;
}

function claimQuest(id){
  ensureQuestState();
  const q=allQuestDefs().find(x=>x.id===id), st=S.player.quests[id];
  if(!q || !st || st.status!=="complete") return;
  const p=S.player, r=q.reward;
  p.exp += r.exp;
  p.gold += r.gold;
  p.inventory["힐링포션(소)"]=(p.inventory["힐링포션(소)"]||0)+r.potions;
  st.status="claimed";
  if(q.rumorLinked && p.rumors) p.rumors[q.stage]={status:"claimed"};
  autoSave();
  goldFlash();
  displayText(`🎉 퀘스트 완료! [${q.title}]`,{highlight:true});
  displayText(`보상 획득: ${questRewardText(r)}`);
  levelUp(p).then(()=>{autoSave();renderScene();questMenu();});
}

function getPlayerIcon(job) {
  if (job.includes("전사") || job.includes("검투사") || job.includes("버서커") || job.includes("사무라이")) return "⚔️";
  if (job.includes("마법") || job.includes("크루세이더")) return "🔮";
  if (job.includes("도적") || job.includes("어쌔신") || job.includes("시프")) return "🗡️";
  return "👤";
}

function getMonsterIcon(name) {
  if (name.includes("슬라임")) return "💧";

/* ---- speed-based turn order (ATB) ---- */
const ATB_BASE = 1000;
function initBattleTimers(){
  const p = S.player;
  p._nextAct = 0;
  S.currentMonsters.forEach(m=>{
    m._nextAct = 0;
    m._first_action_this_turn = false;
  });
}
function advancePlayerTimer(){
  S.player._nextAct = (S.player._nextAct||0) + ATB_BASE / Math.max(1, getSpd(S.player));
}

function getPlayerTurnProgress(p = S.player){
  if(!p) return 0;
  const step = ATB_BASE / Math.max(1, getSpd(p));
  const current = Number(p._nextAct || 0);
  if(current <= 0) return 1;
  const monsters = (S.currentMonsters || []).filter(m => m && m.hp > 0);
  if(!monsters.length) return 1;
  const earliestEnemy = Math.min(...monsters.map(m => Number(m._nextAct || 0)));
  if(current <= earliestEnemy) return 1;
  return clamp(current / Math.max(step, 1), 0, 1);
}

function getUnitTurnProgress(unit){
  if(!unit) return 0;
  const step = ATB_BASE / Math.max(1, Number(unit.spd || getSpd(unit)));
  const current = Number(unit._nextAct || 0);
  if(current <= 0) return 1;
  return clamp(current / Math.max(step, 1), 0, 1);
}

}

function displayText(text, opts={}){
  const log = logEl();
  if(opts.clear) log.innerHTML = "";
  const wrapper = document.createElement("span");
  wrapper.className = "ln";
  wrapper.style.marginBottom = (S.lineSpacing) + "px";
  wrapper.style.fontSize = S.fontSize + "px";
  if(opts.highlight) wrapper.style.fontWeight = "bold";

  text = text.replace(/==================================================/g, "■━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━■");
  text = text.replace(/--------------------------------------------------/g, "────────────────────────────────────────────────────────");

  const chars = Array.from(text);
  let buf = "";
  const flush = ()=>{ if(buf){ wrapper.appendChild(document.createTextNode(buf)); buf=""; } };
  for(const ch of chars){
    const cls = colorSpanFor(ch);
    if(cls){ flush(); const sp=document.createElement("span"); sp.className=cls; sp.textContent=ch; wrapper.appendChild(sp); }
    else buf += ch;
  }
  flush();
  if(log.childNodes.length>0) log.appendChild(document.createElement("br"));
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
}

/* =====================================================================
   버튼 페이징 버그 수정 (항목 4개 + 이전 + 다음 = 총 6개 고정)
===================================================================== */
/* =====================================================================
   버튼 페이징 레이아웃 완벽 수정 (중간 공백 제거 및 자동 정렬)
===================================================================== */
function setPaginatedButtons(btnList, page=0, isEvent=false){
  const maxSlots = 6;
  let items = [];

  // 1. 전체 버튼이 6개 이하일 경우 (페이징 불필요)
  if (btnList.length <= maxSlots) {
    items = btnList.slice().map(arr => {
        if(isEvent && arr[0]!=="") return [arr[0], arr[1], {eventCmd:true}];
        return arr;
    });
  } 
  // 2. 전체 버튼이 6개를 초과할 경우 (페이징 로직 가동)
  else {
    // 현재 페이지의 시작 인덱스 계산 (1페이지는 5개, 2페이지부터는 4개씩 들어감)
    let startIdx = 0;
    for(let i=0; i<page; i++) {
        startIdx += (i === 0) ? 5 : 4;
    }

    const isFirstPage = (page === 0);
    const remaining = btnList.length - startIdx;
    
    // 남은 버튼이 5개 이하면 이번이 마지막 페이지임
    const isLastPage = (!isFirstPage && remaining <= 5);

    // [이전] 버튼 배치 (첫 페이지가 아닐 때 가장 먼저 추가)
    if (!isFirstPage) {
        items.push(["◀ 이전", () => setPaginatedButtons(btnList, page-1, isEvent), {eventCmd: isEvent}]);
    }

    // 실제 컨텐츠 버튼 배치 (빈칸 없이 순서대로 꽉 채움)
    const contentCount = isLastPage ? remaining : (isFirstPage ? 5 : 4);
    for (let i = 0; i < contentCount; i++) {
        if (startIdx + i < btnList.length) {
            let btn = btnList[startIdx + i];
            if(isEvent && btn[0]!=="") {
                items.push([btn[0], btn[1], {eventCmd: true}]);
            } else {
                items.push(btn);
            }
        }
    }

    // [다음] 버튼 배치 (마지막 페이지가 아닐 때 가장 마지막에 추가)
    if (!isLastPage) {
        items.push(["다음 ▶", () => setPaginatedButtons(btnList, page+1, isEvent), {eventCmd: isEvent}]);
    }
  }

  // 화면에 렌더링
  setButtons(items);
}

const AI_CONTENT_VERSION = "stage-pack-v1";

function aiStagePack(stageIdx=S.stageIdx){
  return S.aiContent?.stages?.[stageIdx] || null;
}

function cleanAIJson(text){
  return String(text||"").replace(/```json/gi,"").replace(/```/g,"").trim();
}

function safeChoiceType(v){
  return ["reward","battle","none"].includes(v) ? v : "none";
}

function safeKarma(v){
  const n=Number(v);
  if(!Number.isFinite(n)) return 0;
  return n>0 ? 10 : n<0 ? -10 : 0;
}

function stageAllowedMonsters(stageIdx){
  const [stageName, normalList, eliteList, bossList] = STAGE_DATA[stageIdx] || ["미지의 지역",[],[],["미지의 보스"]];
  return {stageName, normalList:[...normalList], eliteList:[...eliteList], bossList:[...bossList]};
}

function rewardForQuestType(stageIdx,type){
  const s=stageIdx+1;
  if(type==="elite") return {exp:150+s*55,gold:220+s*85,potions:1};
  if(type==="boss") return {exp:300+s*110,gold:420+s*170,potions:2};
  return {exp:90+s*35,gold:120+s*55,potions:1};
}

function validateAIStagePack(raw, stageIdx){
  const allowed=stageAllowedMonsters(stageIdx);
  const allNormal=allowed.normalList;
  const allElite=allowed.eliteList;
  const boss=allowed.bossList[0];
  const source=raw && typeof raw==="object" ? raw : {};

  const rumor=source.rumor && typeof source.rumor==="object" ? source.rumor : {};
  const quests=Array.isArray(source.quests) ? source.quests : [];
  const events=Array.isArray(source.events) ? source.events : [];

  const fallbackRumor=getRumorEvent(stageIdx) || RUMOR_EVENTS[stageIdx] || {title:"수상한 소문",kicker:"FIELD REPORT",story:"주민들 사이에서 수상한 소문이 돌고 있습니다.",objective:"주변을 조사하세요.",target:allNormal[0]||boss,type:"normal",need:3,questKey:"hunt"};
  const normalizedRumor={
    title:String(rumor.title||fallbackRumor.title).slice(0,80),
    kicker:String(rumor.kicker||fallbackRumor.kicker).slice(0,80),
    story:String(rumor.story||fallbackRumor.story).slice(0,500),
    objective:String(rumor.objective||fallbackRumor.objective).slice(0,240),
    target:allNormal.includes(rumor.target) ? rumor.target : (allNormal[0]||boss),
    type:"normal", need:3, questKey:"hunt"
  };

  const fallbackQuestByType={
    normal:{title:"주변의 위협",desc:`${allowed.stageName} 주변에 출몰하는 몬스터를 처치하세요.`,target:allNormal[0]||boss,need:3},
    elite:{title:"위험한 사냥감",desc:`${allowed.stageName}의 정예 몬스터를 처치하고 주민들을 안심시키세요.`,target:allElite[0]||boss,need:1},
    boss:{title:"지역의 지배자",desc:`${allowed.stageName}을(를) 지배하는 보스를 쓰러뜨려 다음 지역의 길을 여세요.`,target:boss,need:1}
  };
  const byType={};
  quests.forEach(q=>{ if(q && ["normal","elite","boss"].includes(q.type) && !byType[q.type]) byType[q.type]=q; });
  byType.normal = byType.normal || {};
  if(normalizedRumor) byType.normal = {...byType.normal, rumorLinked:true};

  const outQuests=["normal","elite","boss"].map(type=>{
    const q=byType[type]||{};
    const fb=fallbackQuestByType[type];
    const allowedTargets=type==="normal"?allNormal:type==="elite"?allElite:[boss];
    const target=allowedTargets.includes(q.target) ? q.target : (type==="normal" && normalizedRumor.target ? normalizedRumor.target : fb.target);
    const linked=type==="normal";
    const title=linked ? normalizedRumor.title : String(q.title||fb.title).slice(0,80);
    const desc=linked ? normalizedRumor.objective : String(q.description||q.desc||fb.desc).slice(0,240);
    const need=type==="normal" ? 3 : type==="elite" ? 1 : 1;
    return {type,title,desc,target,need,rumorLinked:linked,reward:rewardForQuestType(stageIdx,type)};
  });

  const normalizedEvents=events.slice(0,5).map((ev,i)=>{
    const choices=Array.isArray(ev?.choices)?ev.choices:[];
    const safeChoices=choices.slice(0,3).map((c,j)=>({
      text:String(c?.text||(["도와준다","상황을 지켜본다","지나쳐 간다"][j]||"선택한다")).slice(0,100),
      karma_change:safeKarma(c?.karma_change),
      type:safeChoiceType(c?.type),
      reward_tier:["small","medium","none"].includes(c?.reward_tier)?c.reward_tier:"none"
    }));
    while(safeChoices.length<3) safeChoices.push({text:"지나쳐 간다",karma_change:0,type:"none",reward_tier:"none"});
    return {story:String(ev?.story||"길을 걷던 중 수상한 기척이 느껴집니다.").slice(0,500),choices:safeChoices};
  });

  return {version:AI_CONTENT_VERSION,stage:stageIdx,generatedAt:Date.now(),rumor:normalizedRumor,quests:outQuests,events:normalizedEvents};
}

async function generateAIStagePack(stageIdx=S.stageIdx){
  const p=S.player;
  const allowed=stageAllowedMonsters(stageIdx);
  const karmaDesc=p.karma>=65?"선한 성향":(p.karma<=35?"악한 성향":"중립 성향");
  const prompt=`당신은 DARK ABYSS 판타지 텍스트 RPG의 지역 콘텐츠 작가입니다.
이번 호출에서는 STAGE ${stageIdx+1}의 콘텐츠를 한 번에 묶어서 생성합니다.
중요: 보상 수치, 몬스터 능력치, 전투 결과는 생성하지 마세요. 실제 게임 엔진이 결정합니다.
플레이어: 레벨 ${p.level}, 직업 ${p.current_job}, Karma ${p.karma} (${karmaDesc})
지역: ${allowed.stageName}
일반 몬스터 후보: ${JSON.stringify(allowed.normalList)}
정예 몬스터 후보: ${JSON.stringify(allowed.eliteList)}
보스 후보: ${JSON.stringify(allowed.bossList)}

반드시 순수 JSON 하나만 반환하세요.
형식:
{
  "rumor":{"title":"...","kicker":"FIELD REPORT · ...","story":"2~3문장","objective":"...","target":"일반 몬스터 후보 중 1개"},
  "quests":[
    {"type":"normal","title":"...","description":"...","target":"일반 몬스터 후보 중 1개"},
    {"type":"elite","title":"...","description":"...","target":"정예 몬스터 후보 중 1개"},
    {"type":"boss","title":"...","description":"...","target":"보스 후보의 첫 번째 이름"}
  ],
  "events":[
    {"story":"2~3문장","choices":[
      {"text":"...","karma_change":10,"type":"reward","reward_tier":"small"},
      {"text":"...","karma_change":-10,"type":"battle","reward_tier":"none"},
      {"text":"...","karma_change":0,"type":"none","reward_tier":"none"}
    ]}
  ]
}
이벤트는 5개 이하로 생성하세요. reward_tier는 small/medium/none 중 하나이며 실제 골드 금액은 절대 쓰지 마세요.`;

  const res=await fetch(`/api/gemini`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
  if(!res.ok) throw new Error(`AI HTTP ${res.status}`);
  const data=await res.json();
  if(!data.candidates?.[0]?.content?.parts?.[0]?.text) throw new Error("API 응답 형식 오류");
  return validateAIStagePack(JSON.parse(cleanAIJson(data.candidates[0].content.parts[0].text)),stageIdx);
}

async function ensureAIStageContent(stageIdx=S.stageIdx, options={}){
  if(aiStagePack(stageIdx)) return aiStagePack(stageIdx);
  if(!S.aiContent.stages) S.aiContent.stages={};
  if(S.aiContent._loading?.[stageIdx]) return S.aiContent._loading[stageIdx];

  if(!S.aiContent._loading) S.aiContent._loading={};
  const run=(async()=>{
    try{
      if(options.showLoader){ aiLoader().classList.add("show"); toast("지역 콘텐츠를 준비하는 중..."); }
      const pack=await generateAIStagePack(stageIdx);
      S.aiContent.stages[stageIdx]=pack;
      delete S.aiContent._loading[stageIdx];
      autoSave();
      return pack;
    }catch(e){
      console.warn("AI stage pack generation failed",e);
      delete S.aiContent._loading[stageIdx];
      return null;
    }finally{
      if(options.showLoader) aiLoader().classList.remove("show");
    }
  })();
  S.aiContent._loading[stageIdx]=run;
  return run;
}

function getCachedEvent(){
  const pack=aiStagePack(S.stageIdx);
  if(!pack || !Array.isArray(pack.events) || !pack.events.length) return null;
  if(!pack._eventQueue || !pack._eventQueue.length){
    pack._eventQueue=pack.events.map((_,i)=>i).sort(()=>Math.random()-0.5);
  }
  const idx=pack._eventQueue.shift();
  return pack.events[idx] || null;
}

function eventRewardGold(tier,stageIdx=S.stageIdx){
  const s=stageIdx+1;
  if(tier==="medium") return randInt(90+s*20,150+s*30);
  if(tier==="small") return randInt(45+s*10,80+s*15);
  return 0;
}

/* =====================================================================
   CACHED AI RANDOM EVENT — NO API CALL DURING DUNGEON PLAY
===================================================================== */
async function triggerRandomEvent(locationStr, callback) {
  if(Math.random()>0.3) return callback();

  let eventData=getCachedEvent();
  if(!eventData){
    return callback();
  }

  S.isEvent=true;
  setButtons([]);
  displayText(`\n🔮 안개 속에서 미지의 기운이 느껴집니다...`);
  aiLoader().classList.remove("show");
  displayText(`\n📜 [돌발 이벤트]`,{highlight:true,clear:true});
  displayText(eventData.story);

  const btns=eventData.choices.map(c=>[
    c.text,
    ()=>resolveEvent(c,callback)
  ]);
  setPaginatedButtons(btns,0,true);
}

async function resolveEvent(choice, callback) {
  setButtons([]);
  const p=S.player;
  const karmaChange=safeKarma(choice.karma_change);
  p.karma=clamp(p.karma+karmaChange,0,100);

  displayText(`\n▶ [당신의 선택] ${choice.text}`,{highlight:true});
  if(choice.type==="reward"){
    const g=eventRewardGold(choice.reward_tier,S.stageIdx);
    if(g>0){ p.gold+=g; displayText(`▶ 도움의 대가로 💰 ${g}G를 획득했습니다!`); }
    else displayText("▶ 작은 기회를 얻었지만 특별한 보상은 없습니다.");
  }else if(choice.type==="battle"){
    displayText("▶ 전투가 시작됩니다!");
  }else{
    displayText("▶ 아무 일도 일어나지 않고 지나갑니다.");
  }

  if(karmaChange>0) displayText(`👼 선향 수치가 증가했습니다! (현재 ${p.karma})`);
  else if(karmaChange<0) displayText(`👿 악향 수치가 감소했습니다! (현재 ${p.karma})`);

  autoSave();
  await wait(1200);
  S.isEvent=false;
  if(choice.type==="reward") town();
  else callback();
}

function createPlayer(name, baseJob){
  const p = {
    name, base_job:baseJob, current_job:baseJob, is_advanced:false,

    equipped_weapon:null, equipped_armor:null, equipped_accessory:null,

    quests:{}, rumors:{},
    inn_use_count:0, next_attack_boost:false,
    skills:{}, dungeon_clears: {}
  };
  for(const [k,v] of Object.entries(BASE_SKILLS[baseJob])){
    // 가장 기초적인 5등급 스킬 1개만 잠금 해제된 상태로 시작합니다.
    p.skills[k] = Object.assign({}, v, {unlocked: (v.rank === 5)});
  }
  if(baseJob==="전사"){ p.max_hp=200; p.max_mp=50; p.atk=25; p.def_stat=15; p.spd=15; }
  else if(baseJob==="마법사"){ p.max_hp=120; p.max_mp=150; p.atk=35; p.def_stat=8; p.spd=20; }
  else { p.max_hp=150; p.max_mp=80; p.atk=20; p.def_stat=10; p.spd=35; }
  p.hp=p.max_hp; p.mp=p.max_mp;
  return p;
}

/* =====================================================================
   KARMA EFFECTS & STATS CALCULATION
===================================================================== */
function getKarmaEffects(p) {
  let priceMult = 1.0;
  let atkMult = 1.0;
  let defMult = 1.0;
  let critBonus = 0;
  let desc = [];

  if (p.karma >= 80) {
      priceMult = 0.8; defMult = 1.15;
      desc.push("물가 20% 할인"); desc.push("방어력 15% 증가"); desc.push("성자 전용 조우 발생");
  } else if (p.karma >= 65) {
      priceMult = 0.9; defMult = 1.05;
      desc.push("물가 10% 할인"); desc.push("방어력 5% 증가"); desc.push("선인 전용 조우 발생");
  } else if (p.karma <= 20) {
      priceMult = 1.2; atkMult = 1.15; defMult = 0.9; critBonus = 0.1;
      desc.push("물가 20% 바가지"); desc.push("공격력 15%, 크리티컬 10% 증가"); desc.push("방어력 10% 감소"); desc.push("암시장 및 추적자 등장");
  } else if (p.karma <= 35) {
      priceMult = 1.1; atkMult = 1.05;
      desc.push("물가 10% 바가지"); desc.push("공격력 5% 증가"); desc.push("악인 전용 조우 발생");
  } else {
      desc.push("특별한 혜택이나 불이익이 없는 평범한 상태입니다.");
  }
  return { priceMult, atkMult, defMult, critBonus, desc: desc.join(" / ") };
}

function getFinalPrice(basePrice) {
  const p = S.player;
  if (!p) return basePrice;
  const k = getKarmaEffects(p);
  return Math.max(1, Math.floor(basePrice * k.priceMult));
}

function getAtk(p){
  const wBonus = p.equipped_weapon ? p.equipped_weapon.atk : 0;
  const wEnh = p.equipped_weapon ? (p.equipped_weapon.enhance||0) : 0;
  const base = p.atk + wBonus + wEnh*8;
  const k = getKarmaEffects(p);
  return Math.floor(base * k.atkMult);
}
function getDef(p){
  const aBonus = p.equipped_armor ? (p.equipped_armor.def||0) : 0;
  const base = p.def_stat + aBonus + p.armor_level*5;
  const k = getKarmaEffects(p);
  return Math.floor(base * k.defMult);
}
/* =====================================================================
   스탯 계산 (던전 환경 페널티 적용)
===================================================================== */
function getCrit(p){
  const accBonus = p.equipped_accessory ? (p.equipped_accessory.crit||0) : 0;
  const baseCrit = p.base_job.includes("도적") ? 0.2 : 0.1;
  const k = getKarmaEffects(p);
  let finalCrit = baseCrit + accBonus + k.critBonus;
  
  // [환경 페널티] 1스테이지: 시야 제한 (크리티컬 15% 감소)
  if (S.currentMonsters && S.currentMonsters.length > 0 && S.stageIdx === 0) {
      finalCrit -= 0.15; 
  }
  return Math.max(0, finalCrit);
}

function getSpd(p){
  let base = p.spd || 10;
  if(p.equipped_weapon && p.equipped_weapon.spd) base += p.equipped_weapon.spd;
  if(p.equipped_armor && p.equipped_armor.spd) base += p.equipped_armor.spd;
  if(p.equipped_accessory && p.equipped_accessory.spd) base += p.equipped_accessory.spd;
  
  // [환경 페널티] 6스테이지: 살인적인 추위 (행동 속도 20% 감소)
  if (S.currentMonsters && S.currentMonsters.length > 0 && S.stageIdx === 5) {
      base *= 0.8; 
  }
  return Math.floor(base);
}

async function levelUp(p){
  let leveled = false;
  while(p.exp >= p.level*120){
    p.exp -= p.level*120;
    p.level += 1;
    const f = p.is_advanced ? 1.2 : 1.0;
    p.max_hp += Math.floor(38*f);
    p.max_mp += Math.floor(18*f);
    p.atk += Math.floor(7*f);
    p.def_stat += Math.floor(4*f);
    p.spd += Math.floor(2*f);
    const hpHeal = Math.floor(p.max_hp*0.25);
    const mpHeal = Math.floor(p.max_mp*0.25);
    p.hp = Math.min(p.max_hp, p.hp+hpHeal);
    p.mp = Math.min(p.max_mp, p.mp+mpHeal);
    displayText(`▶ LEVEL UP! 레벨 ${p.level}이(가) 되었습니다!`);
    leveled = true;
    // (이전에 있던 스킬 자동 습득 로직 제거됨)
  }
  return leveled;
}

function advanceJobFn(p, newJob){
  p.is_advanced = true;
  p.current_job = newJob;
  const mods = ADVANCE_JOBS[newJob];
  p.max_hp = Math.floor(p.max_hp*mods.hp);
  p.max_mp = Math.floor(p.max_mp*mods.mp);
  p.atk = Math.floor(p.atk*mods.atk);
  p.def_stat = Math.floor(p.def_stat*mods.def);
  p.spd = Math.floor(p.spd*mods.spd);
  p.hp = p.max_hp; p.mp = p.max_mp;
  for(const [sName, sData] of Object.entries(mods.skills)){
    // 전직 스킬도 기본적으로 잠겨있으며, 마법 연구소에서 거금을 주고 구매해야 합니다.
    p.skills[sName] = Object.assign({}, sData, {unlocked: false});
  }
}

/* =====================================================================
   몬스터 생성 (던전 환경에 따른 적 버프 적용)
===================================================================== */
function createMonster(name, mType, stage){
  const scale = 1.15 + (stage-1)*0.65;
  let hp=90*scale, atk=20*scale, def=8*scale, expR=42*scale, goldR=50*scale, spd=10+stage*5;
  if(mType==="중간보스"){ hp*=2.8; atk*=1.7; expR*=2.6; goldR*=2.4; spd*=1.2;}
  else if(mType==="보스"){ hp*=5.8; atk*=2.3; def*=1.6; expR*=5.5; goldR*=6.2; spd*=1.5;}
  
  // [환경 페널티] 적군 버프 적용
  if (stage === 3) { // 3스테이지 버려진 광산 (어둠으로 인한 기습 - 적 속도 20% 상승)
      spd *= 1.2; 
  } else if (stage === 4) { // 4스테이지 오크 야영지 (피의 광폭화 - 적 공격력 20% 상승, 방어력 15% 하락)
      atk *= 1.2; 
      def *= 0.85;
  }

  const ultimateSkill = getUltimateSkillData(name, mType);
  
  return {
    name, m_type:mType,
    max_hp:Math.floor(hp), hp:Math.floor(hp),
    atk:Math.floor(atk), def_stat:Math.floor(def), spd:Math.floor(spd),
    exp_reward:Math.floor(expR), gold_reward:Math.floor(goldR),
    turn_count:0, is_charging:false,
    ultimate_skill:ultimateSkill,
    is_defending:false, def_boost:1.0,
    ultimate_prep_counter:0, is_ultimate_ready:false
  };
}

function getKarmaTitle(karma) {
  if(karma >= 80) return "성자";
  if(karma >= 65) return "선인";
  if(karma <= 20) return "악마";
  if(karma <= 35) return "악인";
  return "중립";
}

function playerTitleAndPower(p){
  const cp = getAtk(p)*3 + getDef(p)*2 + p.level*20;
  let title;
  if(cp<120) title="🌱 [F급] 풋내기";
  else if(cp<250) title="🛡️ [E급] 수련생";
  else if(cp<450) title="⚔️ [D급] 용병";
  else if(cp<750) title="🌟 [C급] 숙련자";
  else if(cp<1200) title="🔥 [B급] 영웅";
  else if(cp<1800) title="👑 [A급] 수호자";
  else title="⚡ [S급] 초월자";
  return [title, cp];
}

function shakeApp(){

  if(!app) return;
  app.classList.remove("shake");
  void app.offsetWidth;
  app.classList.add("shake");
  setTimeout(() => { app.classList.remove("shake"); }, 400);
}

function particleBurst(hostEl, element){
  const colors = ELEMENT_COLORS[element] || ELEMENT_COLORS.phys;
  const layer = document.createElement("div");
  layer.className = "particle-layer";
  hostEl.style.position = "relative";
  hostEl.appendChild(layer);
  const n = 14;
  for(let i=0;i<n;i++){
    const sq = document.createElement("div");
    sq.className = "p-square";
    sq.style.background = pick(colors);
    sq.style.left = "50%"; sq.style.top = "50%";
    const ang = Math.random()*Math.PI*2;
    const dist = 30+Math.random()*40;
    sq.style.setProperty("--dx", Math.cos(ang)*dist+"px");
    sq.style.setProperty("--dy", Math.sin(ang)*dist+"px");
    sq.style.animation = `pfly ${0.35+Math.random()*0.25}s ease-out forwards`;
    layer.appendChild(sq);
  }
  setTimeout(()=>layer.remove(), 700);
}

async function animateBattleAction(attacker, elementType, monsterIdx=null){
  const idx = monsterIdx!=null ? monsterIdx : S.targetIndex;
  battleAnim = {playerFlash: attacker!=="player", monsterFlashIdx: attacker==="player" ? idx : null, effectType: elementType};
  renderScene();
  const hostId = attacker==="player" ? `ecard${idx}` : "pcard";
  const host = document.getElementById(hostId);
  if(host){
    host.classList.add("pop");
    if(elementType) particleBurst(host, ELEMENT_OF[elementType] || "phys");
  }
  await wait(300);
  battleAnim = {playerFlash:false, monsterFlashIdx:null, effectType:null};
  renderScene();
}

function askName(){
  return new Promise(resolve=>{
    const root = document.getElementById("modalRoot");
    const box = root.querySelector(".modal-box");
    box.innerHTML = `
      <div class="frame hot"><div class="frame-inner">
        <div class="modal-title">✨ 영웅의 이름을 입력하세요</div>
        <input class="modal-input" id="nameInput" maxlength="10" placeholder="용사" autocomplete="off">
        <div class="modal-actions">
          <div class="action-btn" id="nameOk">확인</div>
        </div>
      </div></div>
    `;
    root.classList.add("show");
    const input = document.getElementById("nameInput");
    input.focus();
    const finish = ()=>{
      const val = input.value.trim() || "용사";
      root.classList.remove("show");
      resolve(val);
    };
    document.getElementById("nameOk").onclick = finish;
    input.addEventListener("keydown", e=>{ if(e.key==="Enter") finish(); });
  });
}

function confirmModal(title, okLabel="확인", cancelLabel="취소"){
  return new Promise(resolve=>{
    const root = document.getElementById("modalRoot");
    const box = root.querySelector(".modal-box");
    box.innerHTML = `
      <div class="frame hot"><div class="frame-inner">
        <div class="modal-title">${title}</div>
        <div class="modal-actions">
          <div class="action-btn" id="mOk">${okLabel}</div>
          <div class="action-btn" id="mCancel">${cancelLabel}</div>
        </div>
      </div></div>
    `;
    root.classList.add("show");
    document.getElementById("mOk").onclick = ()=>{ root.classList.remove("show"); resolve(true); };
    document.getElementById("mCancel").onclick = ()=>{ root.classList.remove("show"); resolve(false); };
  });
}

async function town(){
  setButtons([]);
  const aiPack=await ensureAIStageContent(S.stageIdx,{showLoader:true});
  if(!aiPack) toast("AI 콘텐츠를 불러오지 못해 기본 지역 콘텐츠를 사용합니다.");
  clearBattle();
  renderScene();

  const currentTown = TOWN_DATA[S.stageIdx];
  const [heroTitle, cPower] = playerTitleAndPower(S.player);
  const rumorIdx = Math.min(S.stageIdx, TOWN_RUMORS.length-1);
  const [stageName] = STAGE_DATA[S.stageIdx] || ["미지의 지역"];
  const p = S.player;
  const invCount = Object.values(p.inventory || {}).reduce((a,b)=>a+b,0);

  const rumorSource = aiPack?.rumor?.story || TOWN_RUMORS[rumorIdx];
  const rumorText = String(rumorSource)
    .replace(/🍺\s*\[[^\]]+\]\s*/, "")
    .replace(/^\s*•\s*/, "")
    .replace(/^\s*[-·]\s*/, "");

  // 카르마 적용 텍스트
  const karmaData = getKarmaEffects(p);
  const karmaFlavorText = `현재 적용 중인 패시브: ${karmaData.desc}`;

  // 스테이지별 마을 고유 효과 및 위험도 데이터
  const townFeatures = [
    { perkIcon: "🛏️", perkName: "초원의 안식처", perkDesc: "여관 이용 시 휴식 효율 극대화", threat: 25, threatLabel: "비교적 안전" },
    { perkIcon: "👻", perkName: "망자의 축복", perkDesc: "언데드 사냥 시 카르마 추가 획득", threat: 55, threatLabel: "경계 필요" },
    { perkIcon: "🔨", perkName: "풍부한 광맥", perkDesc: "장비 강화 비용 10% 보정 혜택", threat: 70, threatLabel: "위험 증가" },
    { perkIcon: "🪓", perkName: "투지의 함성", perkDesc: "전투 진입 시 첫 턴 공격력 상승", threat: 85, threatLabel: "전운 고조" },
    { perkIcon: "🔥", perkName: "용암의 제련", perkDesc: "무기 강화 시 파괴 확률 소폭 하락", threat: 92, threatLabel: "매우 위험" },
    { perkIcon: "❄️", perkName: "극한의 적응", perkDesc: "전투 시 얼음 속성 저항력 획득", threat: 96, threatLabel: "생존 주의" },
    { perkIcon: "⚔️", perkName: "최후의 결의", perkDesc: "모든 스킬 위력 및 크리티컬 증가", threat: 100, threatLabel: "파멸 임박" }
  ];
  const feature = townFeatures[S.stageIdx] || townFeatures[0];

  const log = logEl();
  log.innerHTML = `
    <div class="town-hub">
      <div class="town-hero">
        <section class="town-location scene-panel">
          <div class="town-kicker">SAFE ZONE · STAGE ${String(S.stageIdx+1).padStart(2,'0')}</div>
          <h2 class="town-title">🏡 ${currentTown.name}<span>FRONTIER TOWN</span></h2>
          <p class="town-desc">${currentTown.desc} 이곳에서 장비를 정비하고, 다음 모험을 준비할 수 있습니다.</p>
          
          <!-- 지역 혜택 및 위험도 대시보드 -->
          <div class="town-status-wrap">
            <div class="town-status-card">
              <div class="title"><span>지역 혜택</span><span>${feature.perkIcon}</span></div>

              <div class="desc">${feature.perkDesc}</div>
            </div>
            <div class="town-status-card">
              <div class="title"><span>외곽 위험도</span><span style="color:#e0616c;">${feature.threat}%</span></div>
              <div class="content" style="color:#e0616c;">${feature.threatLabel}</div>
              <div class="threat-bar"><div class="threat-fill" style="width:${feature.threat}%;"></div></div>
            </div>
          </div>

          <div class="town-meta">
            <span class="town-chip">🛡️ 안전 지역</span>
            <span class="town-chip">📍 ${stageName} 인근</span>
            <span class="town-chip">💰 ${p.gold} G</span>
          </div>
        </section>
        
        <!-- 우측 공지사항 패널 -->
        <section class="town-notice">
          <div class="label">ADVENTURER'S NOTICE</div>
          <strong>“다음 목적지는 <b>${stageName}</b>.<br>준비가 끝났다면 길을 나서십시오.”</strong>
          <small>현재 칭호 ${heroTitle}<br>종합 전투력 ${cPower} · 포션 ${invCount}개 보유</small>
        </section>
      </div>

      <!-- 마을 소식 구역 -->
      <section class="town-section">
        <div class="town-section-head">
          <span class="town-section-title">📜 오늘의 마을 소식</span>
          <span class="town-section-sub">RUMOR BOARD</span>
        </div>
        <div class="town-rumor-wrap">
          <div class="town-rumor town-rumor-action ${getRumorState(S.stageIdx).status==="claimed" ? "is-done" : ""}" id="rumorBoardAction" role="button" tabindex="0">
            ${rumorText}<span class="town-rumor-source">— ${currentTown.name} 주민의 제보</span>
            <span class="rumor-action-hint"><span>${getRumorState(S.stageIdx).status==="claimed" ? "이 소문은 해결되었습니다." : "이 소문에는 숨겨진 의뢰가 있을지도 모릅니다."}</span><b>${getRumorState(S.stageIdx).status==="claimed" ? "조사 완료" : "🔎 소문 조사"}</b></span>
          </div>
        </div>
      </section>

      <!-- 세간의 평가 (카르마) 구역 -->
      <section class="town-section">
        <div class="town-section-head">
          <span class="town-section-title">⚖️ 세간의 평가</span>
          <span class="town-section-sub">REPUTATION & KARMA</span>
        </div>
        <div class="town-karma-box">
           <div class="karma-score">👼 나의 선향 지수: ${p.karma} <span>${getKarmaTitle(p.karma)}</span></div>
           <div class="karma-desc">${karmaFlavorText}</div>
        </div>
      </section>

      <!-- 무작위 조우 이벤트 구역 -->
      <section class="town-section">
        <div class="town-section-head">
          <span class="town-section-title">🎲 마을 둘러보기</span>
          <span class="town-section-sub">TOWN ENCOUNTER</span>

           <div class="info">
             <b>여관의 왁자지껄한 소음</b>
             <p>잠시 여유를 내어 마을 사람들과 섞여봅니다. 소소한 대화나 뜻밖의 행운, 혹은 시비가 발생할 수 있습니다.</p>
           </div>
           <div class="action-btn-mini">둘러보기</div>
        </div>
      </section>
    </div>
  `;

  // 마을 배경 이미지 세팅
  const townScene = log.querySelector(".town-location");
  if(townScene) townScene.style.setProperty("--town-scene-bg", EMBEDDED_TOWN_SCENES[currentTown.name] || EMBEDDED_TOWN_SCENES["루센트 마을"]);
  log.scrollTop = 0;

  // 이벤트 리스너 세팅
  const rumorBoardAction = log.querySelector("#rumorBoardAction");
  if(rumorBoardAction){
    rumorBoardAction.addEventListener("click",()=>inspectRumor(S.stageIdx));
  }
  
  const encounterAction = log.querySelector("#townEncounterAction");
  if(encounterAction){
    encounterAction.addEventListener("click", triggerTownEncounter);
  }

  // 메뉴 버튼 렌더링
  setPaginatedButtons([
    ["⚔️ 모험 떠나기", dungeonMenu],
    ["📜 퀘스트 게시판", questMenu],
    ["🛒 상점 가기", shopMenu],
    ["🎒 장비 관리", equipmentInvenMenu],
    ["🏨 여관 / 대장간", townFacilityMenu],
    ["🗺️ 마을 이동", travelTown],
    ["⚙️ 시스템 메뉴", statusOrSaveMenu]
  ]);
}

function statusOrSaveMenu(){
  setButtons([]);
  renderScene();
  displayText("=== [ 시스템 선택 ] ===", {clear:true});
  setButtons([
    ["📊 상태창 확인", showStatus],
    ["🔄 데이터 초기화", resetGameData, {danger:true}],
    ["마을로 돌아가기", town]
  ]);
}

  const log = logEl();
  const p = S.player;
  
  // 마을 인카운터 리스트 (20종)

function travelTown(){
  setButtons([]);
  renderScene();
  displayText("==================================================\n           🗺️ 다른 마을로 이동\n==================================================", {clear:true});
  displayText("지금까지 도달하거나 해금된 안전한 거점들입니다.");

  const unlocked = TOWN_DATA.slice(0, S.stageIdx+1);
  const btnData = [];
  unlocked.forEach((t, idx)=>{
    if(idx===S.stageIdx){
      btnData.push([`📍 ${t.name} (현재)`, ()=>displayText(`이미 ${t.name}에 머물고 있습니다.`)]);
    } else {
      btnData.push([`✈️ S${idx+1}. ${t.name}`, ()=>moveToTownIdx(idx)]);
    }
  });
  btnData.push(["마을로 돌아가기", town]);
  setPaginatedButtons(btnData);
}

async function moveToTownIdx(sNum){
  setButtons([]);
  S.stageIdx = sNum;

  displayText(`▶ 안전하게 ${tName}로 이동했습니다! (스테이지 거점 변경)`);
  await wait(700);
  town();
}

async function enterDungeon(dungeonType){
  setButtons([]);
  S.currentDungeonType = dungeonType;
  
  await triggerRandomEvent("어둡고 위험한 던전의 모퉁이", async () => {
      const [stageName, normalList, eliteList, bossList] = STAGE_DATA[S.stageIdx];
      let pool, mType, count;
      if(dungeonType==="normal"){ pool=normalList; mType="일반"; count=randInt(1,3); }
      else if(dungeonType==="elite"){ pool=eliteList; mType="중간보스"; count=randInt(1,2); }
      else { pool=bossList; mType="보스"; count=1; }

      S.currentMonsters = [];
      for(let i=0;i<count;i++){
        const mName = dungeonType==="boss" ? pool[0] : pick(pool);
        S.currentMonsters.push(createMonster(mName, mType, S.stageIdx+1));
      }
      S.targetIndex = 0;
      S._questProgressChanged = false;

      const names = S.currentMonsters.map(m=>m.name);
      let desc;
      if(dungeonType==="normal"){
        desc = count>1 ? `🌲 [일반 던전] 야생의 몬스터 무리 [${names.join(', ')}]이(가) 나타났습니다! (${count}마리)` : `🌲 [일반 던전] 야생의 [${names[0]}]이(가) 나타났습니다!`;
      } else if(dungeonType==="elite"){
        desc = count>1 ? `💀 [정예 던전] 강력한 정예 몬스터들 [${names.join(', ')}]이(가) 포효합니다!` : `💀 [정예 던전] 강력한 정예 몬스터 [${names[0]}]이(가) 포효합니다!`;

function equipItem(item){
  setButtons([]);
  const p = S.player;
  const t = item.type;
  if(["검","활","지팡이"].includes(t)){
    if(p.equipped_weapon) p.equipment_inventory.push(p.equipped_weapon);
    p.equipped_weapon = item;
    displayText(`▶ [${item.name}[+${item.enhance||0}]] 무기를 장착했습니다!`);
  } else if(["갑옷","투구","방패"].includes(t)){
    if(p.equipped_armor){ p.max_hp -= (p.equipped_armor.hp||0); p.equipment_inventory.push(p.equipped_armor); }
    p.equipped_armor = item;
    p.max_hp += (item.hp||0);
    p.hp = Math.min(p.max_hp, p.hp);
    displayText(`▶ [${item.name}] 방어구를 장착했습니다!`);
  } else {
    if(p.equipped_accessory) p.equipment_inventory.push(p.equipped_accessory);
    p.equipped_accessory = item;
    displayText(`▶ [${item.name}] 장신구를 장착했습니다!`);
  }
  p.equipment_inventory = p.equipment_inventory.filter(i=>i!==item);
  autoSave();
  equipmentInvenMenu();
}

   MOBILE SHOP UI — visual storefront / category / item cards
===================================================================== */
const SHOP_META = {
  "무기":   {icon:"⚔️", label:"WEAPONS", desc:"전투의 기본이 되는 무기를 구매하세요.", accent:"weapon"},
  "방어구": {icon:"🛡️", label:"ARMOR", desc:"생존력을 높여주는 방어 장비를 준비하세요.", accent:"armor"},
  "장신구": {icon:"💍", label:"ACCESSORIES", desc:"치명타와 속도를 끌어올리는 특별한 장신구.", accent:"accessory"},
  "포션":   {icon:"🧪", label:"POTIONS", desc:"전투 중 사용할 회복 아이템을 비축하세요.", accent:"potion"}
};

function shopEscape(v){
  return String(v ?? "").replace(/[&<>\"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}
function shopIcon(item, cat){
  if(cat==="무기") return item.type==="지팡이" ? "🔮" : (item.name.includes("단검") ? "🗡️" : "⚔️");
  if(cat==="방어구") return item.type==="방패" ? "🛡️" : (item.type==="투구" ? "🪖" : "🥋");
  if(cat==="장신구") return item.type==="목걸이" ? "📿" : "💍";
  return item.effect==="mana" ? "💙" : "❤️";
}
function shopRarity(item){
  if(item.price >= 2000) return ["전설", "legendary"];
  if(item.price >= 1000) return ["영웅", "epic"];
  if(item.price >= 500) return ["희귀", "rare"];
  if(item.price >= 250) return ["고급", "uncommon"];
  return ["일반", "common"];
}
function shopOwned(item, cat){
  const p=S.player;
  if(cat==="포션") return p.inventory?.[item.name] || 0;
  const equipped = [p.equipped_weapon,p.equipped_armor,p.equipped_accessory].filter(Boolean);
  return equipped.some(x=>x.name===item.name) || (p.equipment_inventory||[]).some(x=>x.name===item.name);
}
function shopStats(item, cat){
  const parts=[];
  if(item.atk) parts.push(`<b>ATK</b> +${item.atk}`);
  if(item.def) parts.push(`<b>DEF</b> +${item.def}`);
  if(item.hp) parts.push(`<b>HP</b> +${item.hp}`);
  if(item.spd) parts.push(`<b>SPD</b> +${item.spd}`);
  if(item.crit) parts.push(`<b>CRT</b> +${Math.round(item.crit*100)}%`);
  if(cat==="포션") parts.push(item.heal ? `<b>HP</b> +${item.heal}` : `<b>MP</b> +${item.mp}`);
  return parts.length ? parts.map(x=>`<span>${x}</span>`).join("") : `<span>기본 효과</span>`;
}
function shopButtonState(item, cat){
  const owned=shopOwned(item,cat);
  const poor=S.player.gold < item.price;
  if(cat!=="포션" && owned) return {disabled:true,label:"보유 중"};
  if(poor) return {disabled:true,label:"골드 부족"};
  return {disabled:false,label:"구매하기"};
}

function shopCategory(cat){
  setButtons([]);
  renderScene();
  S._shopCategory=cat;
  const meta=SHOP_META[cat];
  const items=SHOP_ITEMS[cat]||[];
  const p = S.player;
  
  const cards=items.map((item,idx)=>{
    const finalPrice = getFinalPrice(item.price);
    const [rarity,rarityClass]=shopRarity(item);
    const owned=shopOwned(item,cat);
    const poor = p.gold < finalPrice;
    
    let state = {disabled:false, label:"구매하기"};
    if(cat!=="포션" && owned) state = {disabled:true,label:"보유 중"};
    else if(poor) state = {disabled:true,label:"골드 부족"};

    const qty=cat==="포션" ? `<span class="shop-qty">보유 ${owned}개</span>` : (owned?`<span class="shop-owned">보유 중</span>`:``);
    const weaponEnh=cat==="무기"?`<span class="shop-level">+0</span>`:"";
    
    // 할증/할인에 따른 색상 변경
    const priceColor = getKarmaEffects(p).priceMult < 1.0 ? "#287a2a" : (getKarmaEffects(p).priceMult > 1.0 ? "#a83232" : "#704a0e");

    return `<article class="shop-item-card ${rarityClass} ${state.disabled?'is-disabled':''}">
      <div class="shop-item-visual"><span class="shop-item-icon">${shopIcon(item,cat)}</span><span class="shop-rarity">${rarity}</span>${weaponEnh}</div>
      <div class="shop-item-body">
        <div class="shop-item-type">${shopEscape(item.type)} ${qty}</div>
        <h3>${shopEscape(item.name)}</h3>
        <p>${shopEscape(item.desc || (item.heal?`체력 ${item.heal} 회복`:`마나 ${item.mp} 회복`))}</p>
        <div class="shop-stat-row">${shopStats(item,cat)}</div>
      </div>
      <div class="shop-item-buy">
        <div class="shop-price" style="color:${priceColor};"><span>💰</span>${finalPrice.toLocaleString()}<small>G</small></div>
        <button class="shop-buy-btn" ${state.disabled?'disabled':''} data-shop-buy="${idx}" data-shop-cat="${shopEscape(cat)}">${state.label}</button>
      </div>
    </article>`;
  }).join("");
  renderShopShell(`
    <div class="shop-category-head ${meta.accent}">
      <div class="shop-category-bigicon">${meta.icon}</div>
      <div><div class="shop-kicker">${meta.label}</div><h2>${cat} 상점</h2><p>${meta.desc}</p></div>
    </div>
    <div class="shop-list-head"><strong>추천 상품</strong><span>${items.length} ITEMS</span></div>
    <div class="shop-item-grid">${cards}</div>
  `);
  setButtons([
    ["🛒 상점 메인",shopMenu],
    ["↩ 마을로 돌아가기",town]
  ]);
}

function buyItem(item,cat){
  const finalPrice = getFinalPrice(item.price);
  if(S.player.gold < finalPrice){ toast("골드가 부족합니다!"); return; }
  if(cat!=="포션"){
    const p=S.player;
    const equippedNames=[p.equipped_weapon,p.equipped_armor,p.equipped_accessory].filter(Boolean).map(x=>x.name);
    const invenNames=(p.equipment_inventory||[]).map(e=>e.name);
    if(equippedNames.includes(item.name) || invenNames.includes(item.name)){
      toast("이미 보유 중인 장비입니다.");
      return;
    }
  }
  S.player.gold -= finalPrice;
  if(cat==="포션"){
    const pName=item.name;
    S.player.inventory[pName]=(S.player.inventory[pName]||0)+1;
    toast(`${item.name} 구매 완료!`);
  }else{
    const newItem=Object.assign({},item);
    if(cat==="무기") newItem.enhance=0;
    S.player.equipment_inventory.push(newItem);
    toast(`${newItem.name} 구매 완료!`);
  }
  autoSave();
  shopCategory(cat);
}

function rest(){
  const p = S.player;
  const baseInnPrice = 50 + p.inn_use_count*30;
  const innPrice = getFinalPrice(baseInnPrice);
  
  if(p.gold >= innPrice){
    p.gold -= innPrice; p.inn_use_count += 1;
    p.hp = p.max_hp; p.mp = p.max_mp;
    autoSave();
    displayText(`▶ 여관에서 푹 쉬었습니다! 체력과 마나가 모두 회복되었습니다. (비용: ${innPrice}G 지불)`);
  } else {
    displayText(`▶ 골드가 부족합니다! (필요 골드: ${innPrice}G)`);
  }
  displayText(`(현재 골드: ${p.gold}G | HP: ${p.hp}/${p.max_hp})`);
  renderScene();
  townFacilityMenu();
}

function makeBar(current, max) {
    const fill = Math.round((current / max) * 10);
    return `[${'■'.repeat(fill)}${'□'.repeat(10-fill)}]`;
}

/* =====================================================================
   상태창 (인벤토리 전리품 분리 표시)
===================================================================== */
function showStatus(){
  setButtons([]);
  clearBattle();
  renderScene();
  const p = S.player;
  const wEnh = p.equipped_weapon ? (p.equipped_weapon.enhance||0) : 0;
  const wName = p.equipped_weapon ? `${p.equipped_weapon.name}[+${wEnh}]` : "없음";
  const aName = p.equipped_armor ? p.equipped_armor.name : "없음";
  const accName = p.equipped_accessory ? p.equipped_accessory.name : "없음";

  displayText(`=== [ ${p.name} 의 상태창 ] ===`, {clear:true});
  displayText(`▪ 직업: ${p.current_job} | 레벨: ${p.level} (EXP: ${p.exp}/${p.level*100})`);
  displayText(`♥ HP: ${makeBar(p.hp,p.max_hp)} ${p.hp}/${p.max_hp}`);
  displayText(`♣ MP: ${makeBar(p.mp,p.max_mp)} ${p.mp}/${p.max_mp}`);
  displayText(`⚔️ 공격력: ${getAtk(p)} | 🛡️ 방어력: ${getDef(p)} | ⚡ 속도: ${getSpd(p)}`);
  displayText(`💥 크리티컬 확률: ${Math.floor(getCrit(p)*100)}%`);
  displayText(`💰 골드: ${p.gold} G | 👼 선향(Karma): ${p.karma}`);
  displayText(`🛡️ [장착 장비] 무기: ${wName} | 갑옷: ${aName} | 장신구: ${accName}`);

  // [신규] 인벤토리를 포션과 전리품으로 나누어 출력
  const potions = Object.entries(p.inventory).filter(([k,v])=>v>0 && k.includes("포션"));
  const loots = Object.entries(p.inventory).filter(([k,v])=>v>0 && !k.includes("포션"));
  
  const potionStr = potions.map(([k,v])=>`${k} ${v}개`).join(", ") || "없음";
  displayText(`🧪 [인벤토리 포션] ${potionStr}`);
  
  if(loots.length > 0) {
    const lootStr = loots.map(([k,v])=>`${k} ${v}개`).join(", ");
    displayText(`📦 [획득한 전리품] ${lootStr}`);
  }

  const unlocked = Object.entries(p.skills).filter(([,v])=>v.unlocked);
  if(unlocked.length){
    displayText("\n[ 보유 스킬 ]");
    unlocked.sort((a,b)=>b[1].rank-a[1].rank).forEach(([k,v])=>{
      const r = v.rank>0 ? `[${v.rank}등급]` : "[전직전용]";
      const u = v.upgrade>0 ? `+${v.upgrade}` : "";
      displayText(` - ${r} ${k} ${u} (MP:${v.mp}) : x${(v.mult+v.upgrade*0.2).toFixed(1)}`);
    });
  }
  setButtons([["마을로 돌아가기", town]]);
}
/* =====================================================================
   상점 전리품 일괄 판매 로직
===================================================================== */
function sellAllLoot() {
  setButtons([]);
  const p = S.player;
  let totalEarned = 0;
  let soldItems = [];
  
  for (const [item, qty] of Object.entries(p.inventory)) {
      if (!item.includes("포션") && qty > 0) {
          const basePrice = (LOOT_PRICES[item] || 10) * qty;
          // 이전에 추가한 카르마 효과에 따라 매입가도 변동 (선인은 비싸게, 악인은 싸게 팜)
          const karmaMult = getKarmaEffects(p).priceMult; 
          const finalPrice = karmaMult > 1.0 ? Math.floor(basePrice * 0.8) : (karmaMult < 1.0 ? Math.floor(basePrice * 1.2) : basePrice);
          
          totalEarned += finalPrice;
          soldItems.push(`${item} ${qty}개`);
          p.inventory[item] = 0; // 아이템 비우기
      }
  }
  
  if (totalEarned > 0) {
      p.gold += totalEarned;
      goldFlash();
      displayText(`\n▶ 전리품을 모두 팔아 💰 ${totalEarned}G를 획득했습니다!`, {highlight: true});
      displayText(` (판매 목록: ${soldItems.join(", ")})`);
      autoSave();
  } else {
      displayText(`\n▶ 가방에 판매할 전리품이 없습니다.`);
  }
  
  setTimeout(shopMenu, 2500);
}

      <div class="shop-category-bigicon" style="background:linear-gradient(145deg,#2e4a15,#5c8a2e); border-color:#7a9c5c;">⚖️</div>

    </div>

    <div class="shop-item-grid">${cards}</div>
  `);

  // 하단 버튼 구성
  setButtons([
    ["📦 모두 팔기 (일괄 매각)", sellAllLoot],
    ["🛒 상점 메인", shopMenu],

function sellSingleLoot(itemName, price) {
  const p = S.player;
  if (!p.inventory[itemName] || p.inventory[itemName] <= 0) {
      toast("해당 전리품이 없습니다.");
      return;
  }
  
  p.inventory[itemName] -= 1;
  p.gold += price;
  autoSave();
  
  // 판매 완료 시 반짝이는 효과와 메시지
  goldFlash();
  toast(`[${itemName}] 판매 완료! (+${price}G)`);
  
  // 수량 변동을 반영하기 위해 화면 즉시 새로고침
  shopSellMenu();
}

   대장간 (카드 UI 적용)
===================================================================== */
function blacksmith(){
  setButtons([]);
  clearBattle();
  renderScene();
  const p = S.player;

  if(!p.equipped_weapon){
    logEl().innerHTML = `
      <div class="equip-board">
        <div class="equip-head"><div><div class="equip-kicker">BLACKSMITH</div><div class="equip-title">🔨 대장간</div></div></div>
        <div class="equip-empty-msg" style="margin-top:20px;">❌ 현재 장착 중인 무기가 없습니다! 무기를 먼저 장착해주세요.</div>
      </div>`;
    setButtons([["편의시설로", townFacilityMenu], ["마을로", town]]);
    return;
  }

  if(p.equipped_weapon.enhance===undefined) p.equipped_weapon.enhance = 0;
  const wItem = p.equipped_weapon;
  const wEnh = wItem.enhance;
  const wCostBase = Math.floor((wItem.price||200)*0.15);
  const wCost = wCostBase + wEnh*120;
  const wProb = Math.max(5, 95 - wEnh*7);
  const wDestroy = wEnh>0 ? wEnh*1 : 0;

  const aItem = p.equipped_armor;
  const aEnh = p.armor_level;
  const aCostBase = Math.floor((aItem ? aItem.price : 150)*0.15) || (aItem? 0 : 100);
  const aCost = (aItem ? aCostBase : 100) + aEnh*100;
  const aProb = Math.max(5, 95 - aEnh*7);
  const aDestroy = aEnh>0 ? aEnh*1 : 0;

  const wDisp = `${wItem.name} [+${wEnh}]`;
  const aDisp = aItem ? `${aItem.name} [+${aEnh}]` : `기본 방어구 [+${aEnh}]`;

  const tryWeaponUp = ()=>{
    setButtons([]);
    if(!p.equipped_weapon){ displayText("▶ 장착된 무기가 없습니다."); blacksmith(); return; }
    if(p.gold < wCost){ displayText(`▶ 골드가 부족합니다! (필요 골드: ${wCost}G)`); blacksmith(); return; }
    p.gold -= wCost;
    if(randInt(1,100) <= wProb){
      p.equipped_weapon.enhance += 1;
      goldFlash();
      displayText(`🎉 [${p.equipped_weapon.name}] 강화 성공! (현재 +${p.equipped_weapon.enhance})`);
    } else {
      if(wDestroy>0 && randInt(1,100)<=wDestroy){
        shakeApp();
        displayText(`💥 앗! 강화 실패 여파로 [${p.equipped_weapon.name}[+${wEnh}]] 장비가 완전히 파괴되어 소멸했습니다... 😭`);
        p.equipped_weapon = null;
      } else {
        displayText("❌ 무기 강화 실패...");
        if(Math.random()<0.35 && p.equipped_weapon && p.equipped_weapon.enhance>0){
          p.equipped_weapon.enhance -= 1;
          displayText(`💔 장비 손상으로 강화 수치가 -1 하락했습니다... (+${p.equipped_weapon.enhance})`);
        }
      }
    }
    autoSave();
    blacksmith();
  };

  const tryArmorUp = ()=>{
    setButtons([]);
    if(p.gold < aCost){ displayText(`▶ 골드가 부족합니다! (필요 골드: ${aCost}G)`); blacksmith(); return; }
    p.gold -= aCost;
    if(randInt(1,100) <= aProb){
      p.armor_level += 1;
      goldFlash();
      displayText(`🎉 방어구 강화 성공! (현재 +${p.armor_level})`);
    } else {
      if(aDestroy>0 && randInt(1,100)<=aDestroy){
        shakeApp();
        const armorDisp = aItem ? aItem.name : "기본 방어구";
        displayText(`💥 앗! 강화 실패 여파로 [${armorDisp}] 방어구가 완전히 파괴되었습니다... 😭`);
        if(aItem) p.equipped_armor = null;
      } else {
        displayText("❌ 방어구 강화 실패...");
        if(Math.random()<0.35 && p.armor_level>0){
          p.armor_level -= 1;
          displayText(`💔 장비 손상으로 방어구 강화 수치가 -1 하락했습니다... (+${p.armor_level})`);
        }
      }
    }
    autoSave();
    blacksmith();
  };

  logEl().innerHTML = `
    <div class="equip-board">
      <div class="equip-head">
        <div><div class="equip-kicker">BLACKSMITH WORKSHOP</div><div class="equip-title">🔨 대장간 (장비 강화)</div></div>
        <div class="shop-wallet"><span>💰</span><strong>${p.gold.toLocaleString()}</strong><small>G</small></div>
      </div>
      <div style="font-size:11px; color:#5b431f; margin-top:4px;">위험한 장비 강화를 시도합니다. 실패 시 장비가 손상되거나 파괴될 수 있습니다.</div>
      
      <div class="forge-lab-grid">
        <div class="forge-card" onclick="window._forgeWeapon()">
          <div>
            <div class="fl-header"><div class="fl-icon">🗡️</div><div><div class="fl-title">무기 강화</div><div class="fl-sub">${wDisp}</div></div></div>
            <div class="fl-body">성공 확률: <b>${wProb}%</b><br>파괴 위험: <span style="color:#b5323f;">${wDestroy}%</span></div>
          </div>
          <div class="fl-footer"><span>💰 ${wCost} G</span><div class="fl-btn">강화하기</div></div>
        </div>

        <div class="forge-card" onclick="window._forgeArmor()">
          <div>
            <div class="fl-header"><div class="fl-icon">🛡️</div><div><div class="fl-title">방어구 강화</div><div class="fl-sub">${aDisp}</div></div></div>
            <div class="fl-body">성공 확률: <b>${aProb}%</b><br>파괴 위험: <span style="color:#b5323f;">${aDestroy}%</span></div>
          </div>
          <div class="fl-footer"><span>💰 ${aCost} G</span><div class="fl-btn">강화하기</div></div>
        </div>
      </div>
    </div>
  `;
  
  // 전역 함수로 임시 등록하여 카드 클릭 시 실행되도록 연결
  window._forgeWeapon = tryWeaponUp;
  window._forgeArmor = tryArmorUp;

  setButtons([
    ["편의시설로", townFacilityMenu],
    ["마을로 돌아가기", town]
  ]);
}

/* =====================================================================

function skillUpgradeMenu(){
  setButtons([]);
  clearBattle();
  renderScene();
  const p = S.player;

  const skills = Object.entries(p.skills);
  const locked = skills.filter(([,v]) => !v.unlocked).sort((a,b) => b[1].rank - a[1].rank);
  const unlocked = skills.filter(([,v]) => v.unlocked).sort((a,b) => b[1].rank - a[1].rank);

  let cardsHtml = "";

  // 1. 배울 수 있는 신규 스킬 카드들
  locked.forEach(([sName, sData]) => {
      const icon = getElemIcon(sData.elem);
      const eName = getElemName(sData.elem);
      cardsHtml += `
        <div class="lab-card" onclick="window._learnSkill('${sName}')">
          <div>
            <div class="fl-header"><div class="fl-icon">${icon}</div><div><div class="fl-title">${sName}</div><div class="fl-sub">[${eName}] 신규 마법</div></div></div>
            <div class="fl-body">위력: <b>x${sData.mult.toFixed(1)}</b><br>마모: MP ${sData.mp}</div>
          </div>
          <div class="fl-footer"><span>💰 ${sData.price} G</span><div class="fl-btn" style="background:#244d75;">학습하기</div></div>
        </div>`;
  });

  // 2. 보유 중인 스킬 강화 카드들
  unlocked.forEach(([sName, sData]) => {
      const up = sData.upgrade;
      const cost = 300 + up * 400;
      const cur = sData.mult + up * 0.2;
      const next = cur + 0.2;
      const icon = getElemIcon(sData.elem);
      const eName = getElemName(sData.elem);
      cardsHtml += `
        <div class="lab-card" onclick="window._upSkill('${sName}')">
          <div>
            <div class="fl-header"><div class="fl-icon">${icon}</div><div><div class="fl-title">${sName} [+${up}]</div><div class="fl-sub">[${eName}] 보유 마법</div></div></div>
            <div class="fl-body">현재 위력: <b>x${cur.toFixed(1)}</b> ➔ <b>x${next.toFixed(1)}</b></div>
          </div>
          <div class="fl-footer"><span>💰 ${cost} G</span><div class="fl-btn">위력 강화</div></div>
        </div>`;
  });

  logEl().innerHTML = `
    <div class="equip-board">
      <div class="equip-head">
        <div><div class="equip-kicker">MAGIC RESEARCH LAB</div><div class="equip-title">📚 마법 연구소</div></div>
