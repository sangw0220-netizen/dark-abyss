<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DARK ABYSS : AI CHRONICLES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100a06;
  --bg-glow:#2a1a0c;
  --wood:#2c1c10;
  --wood-light:#4a3018;
  --wood-lighter:#6b4726;
  --panel:#241708;
  --panel-alt:#1c1207;
  --panel-soft:#3a2712;
  --parchment:#ecd9ab;
  --parchment-dim:#dcc48c;
  --ink:#3a2812;
  --ink-soft:#6e5732;
  --gold:#d9b45c;
  --gold-bright:#f4dd97;
  --gold-dim:#7a5c26;
  --bronze:#a97a3a;
  --text:#ecdcb4;
  --text-dim:#a4906a;
  --red:#b5323f;
  --red-bright:#e0616c;
  --gold-alt:#e0b83e;
  --blue:#3f6f9e;
  --green:#4f7a45;
  --purple:#8c6fae;
  --hp:#8f2430;
  --mp:#2d5478;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% -10%, var(--bg-glow) 0%, var(--bg) 60%),
    repeating-linear-gradient(115deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 2px, transparent 2px, transparent 5px),
    var(--bg);
  color:var(--text);
  font-family:'Noto Serif KR','Cinzel',serif;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:820px;
  margin:0 auto;
  height:100%;
  display:flex;
  flex-direction:column;
  padding:14px 14px 20px;
  gap:10px;
}

/* ---------- title bar ---------- */
#titlebar{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:4px 6px 12px;
  border-bottom:1px solid var(--gold-dim);
  position:relative;
  flex-shrink: 0;
}
#titlebar::after{
  content:"◆";
  position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  color:var(--gold);font-size:10px;background:var(--bg);padding:0 8px;
}
#titlebar h1{
  font-family:'Cinzel Decorative','Cinzel',serif;
  font-weight:900;
  font-size:26px;margin:0;
  letter-spacing:3px;
  background:linear-gradient(180deg,var(--gold-bright) 10%,var(--gold) 55%,var(--bronze) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 0 rgba(0,0,0,0.55), 0 0 18px rgba(217,180,92,0.25);
}
#titlebar .sub{
  font-family:'Cinzel',serif;
  font-size:9px;color:var(--text-dim);margin-top:4px;letter-spacing:3px;text-transform:uppercase;
}
.ctrl-col{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.ctrl-row{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--text-dim);font-family:'Cinzel',serif;letter-spacing:1px;}
.mini-btn{
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--wood-lighter),var(--wood));
  border:1px solid var(--gold-dim);border-radius:2px;
  color:var(--gold-bright);cursor:pointer;font-size:11px;user-select:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
}
.mini-btn:hover{border-color:var(--gold);background:linear-gradient(180deg,#7a5228,#4a3018);}
.mini-btn:active{transform:translateY(1px);}
.mini-btn.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,180,92,.28), inset 0 1px 0 rgba(255,255,255,.12);}


/* ---------- ornate frame ---------- */
.frame{
  position:relative;
  background:linear-gradient(155deg,var(--gold) 0%,var(--gold-dim) 45%,var(--bronze) 100%);
  padding:4px;
  border-radius:3px;
  box-shadow:0 3px 10px rgba(0,0,0,0.45);
}
.frame.hot{background:linear-gradient(155deg,var(--gold-bright) 0%,var(--gold) 45%,#c98f2e 100%);}
.frame::after{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 7px 7px, var(--gold-bright) 0 1.6px, rgba(0,0,0,0.35) 1.6px 2.4px, transparent 3px),
    radial-gradient(circle at calc(100% - 7px) 7px, var(--gold-bright) 0 1.6px, rgba(0,0,0,0.35) 1.6px 2.4px, transparent 3px),
    radial-gradient(circle at 7px calc(100% - 7px), var(--gold-bright) 0 1.6px, rgba(0,0,0,0.35) 1.6px 2.4px, transparent 3px),
    radial-gradient(circle at calc(100% - 7px) calc(100% - 7px), var(--gold-bright) 0 1.6px, rgba(0,0,0,0.35) 1.6px 2.4px, transparent 3px);
}
.frame-inner{
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.10) 0 2px, transparent 2px 26px),
    linear-gradient(180deg,var(--panel),var(--panel-alt));
  border:1px solid #000;
  border-radius:1px;
  padding:10px 12px;
  position:relative;
}
.frame-inner.tight{padding:8px 10px;}

/* ---------- scene (non-battle summary) ---------- */
#scene{font-size:12px; flex-shrink: 0;}
.hud-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;}
.hud-name{color:var(--text);font-weight:normal;}
.hud-name b{color:var(--gold-bright);font-family:'Cinzel',serif;}
.hud-gold{color:var(--gold);font-family:'Cinzel',serif;font-size:11px;}
.bar-line{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10px;}
.bar-label{width:30px;flex-shrink:0;font-family:'Cinzel',serif;letter-spacing:1px;}
.bar-label.hp{color:var(--red-bright);}
.bar-label.hp::before{content:"♥ ";}
.bar-label.mp{color:#7ec2f0;}
.bar-label.mp::before{content:"✦ ";}
.bar-track{
  flex:1;height:13px;background:#150d06;border:1px solid #000;
  outline:1px solid var(--gold-dim);border-radius:7px;
  position:relative;overflow:hidden;
}
.bar-fill{height:100%;transition:width .35s ease-out;border-radius:7px;}
.bar-fill.hp{background:linear-gradient(180deg,var(--red-bright),var(--hp) 55%,#5a1119);}
.bar-fill.mp{background:linear-gradient(180deg,#7ec2f0,var(--mp) 55%,#173650);}
.bar-fill::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0.28) 0%, transparent 35%);
}
.bar-num{width:78px;text-align:right;flex-shrink:0;color:var(--text);font-size:9px;font-family:'Cinzel',serif;}
.hud-stats{margin-top:6px;font-size:10px;color:var(--text);display:flex;gap:8px;flex-wrap:wrap;}
.hud-stats span{
  background:var(--panel-soft);border:1px solid var(--gold-dim);border-radius:3px;
  padding:2px 6px;font-family:'Cinzel',serif;color:var(--gold);
}
.hud-equip{margin-top:6px;font-size:9px;color:var(--text-dim);letter-spacing:0.5px;}

/* ---------- lobby HUD spacing / equipment ---------- */
.lobby-hud{
  padding:12px 10px 13px !important;
}
.lobby-hud .hud-row{
  margin-bottom:9px;
}
.lobby-hud .bar-line{
  margin-top:8px;
}
.lobby-hud .hud-stats{
  margin-top:10px;
  gap:7px;
}
.lobby-hud .hud-stats span{
  padding:3px 7px;
}
.lobby-hud .hud-equip{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  color:var(--text);
  letter-spacing:0;
}
.lobby-hud .hud-equip span{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:3px 8px;
  background:var(--panel-soft);
  border:1px solid var(--gold-dim);
  border-radius:3px;
  font-family:'Cinzel',serif;
  font-size:9px;
  color:var(--gold);
}

/* ---------- battle scene ---------- */
.battle-top{font-size:11px;}
.vs-wrap{display:flex;align-items:stretch;gap:8px;margin-top:8px;}
.combatant-card{
  flex:1;background:radial-gradient(ellipse at 50% 30%, var(--wood-light) 0%, var(--panel-alt) 75%);
  border:1px solid #000;outline:2px solid;border-radius:4px;
  padding:9px 8px;position:relative;min-width:0;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.combatant-card.player{outline-color:var(--mp);}
.combatant-card.enemy{outline-color:var(--hp);}
.combatant-card .tag{
  font-size:8px;letter-spacing:2px;color:var(--text-dim);align-self:flex-start;
  font-family:'Cinzel',serif;text-transform:uppercase;
}
.combatant-card.player .tag{color:#7ec2f0;}
.combatant-card.enemy .tag{color:var(--red-bright);}

/* 💡 새로운 초상화(Image) 스타일 적용 */
.sprite-box{
  width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin:4px 0;
  border-radius:10px; /* 약간 각진 테두리로 픽셀 아트 느낌 강조 */
  background:radial-gradient(circle,#1a1a24 0%,var(--panel-alt) 100%);
  border:2px solid var(--gold-dim);box-shadow:0 0 0 1px #000, inset 0 0 10px rgba(0,0,0,0.6);
  overflow:hidden;
}
.portrait-img {
  width: 86%; 
  height: 86%; 
  object-fit: contain; 
  image-rendering: pixelated; /* 도트가 깨지지 않고 뚜렷하게 보이도록 설정 */
  filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
}

.combatant-card .cname{font-size:11px;color:var(--gold-bright);font-family:'Cinzel',serif;}
.combatant-card .cjob{font-size:9px;color:var(--text-dim);margin-bottom:4px;}
.mini-bar-track{width:100%;height:10px;background:#150d06;border:1px solid #000;border-radius:5px;position:relative;overflow:hidden;outline:1px solid var(--gold-dim);}
.mini-bar-fill{height:100%;}
.mini-bar-fill.hp{background:linear-gradient(180deg,var(--red-bright),var(--hp) 55%,#5a1119);}
.mini-hp-num{font-size:9px;margin-top:3px;color:var(--text-dim);}
.vs-badge{
  flex-shrink:0;width:44px;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--gold);text-shadow:0 0 10px rgba(217,180,92,0.6), 0 2px 0 #000;
}
.flash-red{animation:flashred .3s steps(2);}
@keyframes flashred{0%,100%{background:var(--panel-alt);}50%{background:#5a1a22;}}
.charge-warn{margin-top:8px;font-size:10px;color:var(--red-bright);text-align:center;font-family:'Cinzel',serif;}
.enemy-info{margin-top:8px;font-size:10px;color:var(--gold);text-align:center;}

/* shake */
.shake{animation:shakeit .38s linear;}
@keyframes shakeit{
  10%{transform:translate(-6px,3px);}20%{transform:translate(5px,-4px);}
  30%{transform:translate(-4px,4px);}40%{transform:translate(6px,-3px);}
  50%{transform:translate(-5px,2px);}60%{transform:translate(4px,-4px);}
  70%{transform:translate(-3px,3px);}80%{transform:translate(3px,-2px);}
  90%{transform:translate(-2px,1px);}100%{transform:translate(0,0);}
}
.pop{animation:popit .28s ease-out;}
@keyframes popit{0%{transform:scale(1);}40%{transform:scale(1.03);}100%{transform:scale(1);}}
.crit-flash{animation:critflash .28s steps(2) 2;}
@keyframes critflash{0%,100%{filter:none;}50%{filter:brightness(2.2) sepia(0.2);}}
.gold-flash{animation:goldflash .3s steps(2) 2;}
@keyframes goldflash{0%,100%{box-shadow:none;}50%{box-shadow:inset 0 0 0 4px var(--gold);}}
.cyan-flash{animation:cyanflash .25s steps(2) 1;}
@keyframes cyanflash{0%,100%{box-shadow:none;}50%{box-shadow:inset 0 0 0 4px #7ec2f0;}}

/* ---------- log (parchment page) ---------- */
#logWrap{flex:1;display:flex;min-height:0;}
#logFrame{flex:1;display:flex;}
#logFrame .frame-inner{
  background:
    radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.10), transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(0,0,0,0.12), transparent 55%),
    linear-gradient(175deg, var(--parchment) 0%, var(--parchment-dim) 100%);
  border:1px solid #000;
}
#log{
  flex:1;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
  padding:6px 4px;line-height:1.75;font-size:13px;color:var(--ink);
}
#log::-webkit-scrollbar{width:8px;}
#log::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:4px;}
#log::-webkit-scrollbar-track{background:rgba(0,0,0,0.08);}
.ln{display:block;}
.c-red{color:var(--hp);}
.c-gold{color:#8a5a12;font-weight:600;}
.c-blue{color:#2a4f75;}
.c-green{color:#3d5d33;}
.c-strong{color:#1c1206;font-weight:bold;}

/* ---------- town hub dashboard ---------- */
.town-hub{display:flex;flex-direction:column;gap:9px;color:var(--ink);padding:0;}
.town-hero{display:grid;grid-template-columns:1.25fr .75fr;gap:10px;align-items:start;}
.town-location{position:relative;overflow:hidden;padding:12px 15px;border:1px solid rgba(58,40,18,.35);background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(122,92,38,.08));height:auto;min-height:0;}
.town-location::after{content:"✦";position:absolute;right:16px;top:7px;font-size:38px;color:rgba(138,90,18,.12);}
.town-kicker{font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:var(--ink-soft);margin-bottom:3px;text-transform:uppercase;}
.town-title{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:900;color:#3a2812;margin:0 0 5px;}
.town-title span{font-family:'Cinzel',serif;font-size:10px;font-weight:600;color:#8a5a12;letter-spacing:2px;margin-left:6px;}
.town-desc{font-size:11px;line-height:1.65;margin:0;color:#4d371b;max-width:94%;}
.town-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.town-chip{padding:3px 7px;border:1px solid rgba(138,90,18,.35);background:rgba(255,255,255,.18);font-family:'Cinzel',serif;font-size:8px;color:#6e4b18;border-radius:2px;}
.town-notice{padding:11px 13px;border:1px solid rgba(58,40,18,.35);background:rgba(58,40,18,.055);display:flex;flex-direction:column;justify-content:flex-start;height:auto;min-height:0;}
.town-notice .label{font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;color:#8a5a12;margin-bottom:6px;}
.town-notice strong{font-size:12px;line-height:1.5;color:#3a2812;}
.town-notice small{margin-top:6px;font-size:9px;color:#6e5732;line-height:1.5;}
.town-section{border-top:1px solid rgba(58,40,18,.28);padding-top:8px;}
.town-section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.town-section-title{font-weight:800;font-size:12px;color:#3a2812;}
.town-section-sub{font-family:'Cinzel',serif;font-size:8px;letter-spacing:1px;color:#8a5a12;}
.town-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.town-card{padding:8px;border:1px solid rgba(58,40,18,.26);background:rgba(255,255,255,.13);min-height:58px;}
.town-card .icon{font-size:16px;float:left;margin-right:6px;line-height:1.1;}
.town-card b{font-size:10px;color:#3a2812;}
.town-card p{clear:both;margin:4px 0 0;font-size:8px;line-height:1.5;color:#6e5732;}
.town-rumor{position:relative;padding:9px 12px 9px 15px;border-left:3px solid #a97a3a;background:rgba(169,122,58,.09);font-size:10px;line-height:1.65;color:#4b3518;font-style:italic;}
.town-rumor::before{content:'“';position:absolute;left:4px;top:0;font-family:Georgia,serif;font-size:22px;color:#a97a3a;opacity:.55;}
.town-rumor-source{display:block;margin-top:3px;font-style:normal;font-size:8px;color:#8a5a12;text-align:right;}
.town-progress{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:1px;}
.town-stage-dot{height:6px;border:1px solid #8a5a12;background:rgba(138,90,18,.08);}
.town-stage-dot.done{background:#8a5a12;}
.town-stage-dot.current{background:#d9b45c;box-shadow:0 0 0 1px #6e4b18;}
.town-footer-note{text-align:center;font-size:8px;color:#7a6038;padding-top:1px;letter-spacing:.2px;}
@media(max-width:600px){
  .town-hero{grid-template-columns:1fr;}
  .town-grid{grid-template-columns:1fr;}
  .town-card{min-height:auto;}
}

/* ---------- town hub : single-screen dashboard ---------- */
#log:has(.town-hub){overflow-y:hidden;}
.town-hub{
  height:100%;
  min-height:0;
  gap:6px;
  padding:0 1px 2px;
}
.town-hero{
  flex:0 0 168px;
  min-height:168px;
  grid-template-columns:1.55fr .75fr;
  gap:8px;
}
.town-location,
.town-notice{
  height:100%;
  min-height:0;
  padding:10px 13px;
}
.town-kicker{font-size:8px;letter-spacing:2.5px;margin-bottom:2px;}
.town-title{font-size:19px;margin-bottom:4px;}
.town-title span{font-size:9px;letter-spacing:1.7px;}
.town-desc{font-size:10px;line-height:1.5;}
.town-meta{margin-top:6px;gap:4px;}
.town-chip{padding:3px 6px;font-size:7px;}
.town-notice .label{font-size:7px;letter-spacing:1.7px;margin-bottom:5px;}
.town-notice strong{font-size:11px;line-height:1.4;}
.town-notice small{margin-top:5px;font-size:8px;line-height:1.4;}
.town-section{padding-top:6px;}
.town-section-head{margin-bottom:4px;}
.town-section-title{font-size:11px;}
.town-section-sub{font-size:7px;}
.town-rumor{padding:7px 10px 7px 13px;font-size:9px;line-height:1.45;}
.town-rumor::before{font-size:19px;}
.town-rumor-source{margin-top:2px;font-size:7px;}
.town-grid{gap:6px;}
.town-card{padding:7px;min-height:55px;}
.town-card .icon{font-size:14px;margin-right:5px;}
.town-card b{font-size:9px;}
.town-card p{margin-top:3px;font-size:7px;line-height:1.4;}
.town-progress{gap:3px;margin-top:0;}
.town-stage-dot{height:5px;}
.town-footer-note{font-size:7px;padding-top:1px;}

@media(max-width:600px){
  #log:has(.town-hub){overflow-y:auto;}
  .town-hub{height:auto;min-height:0;}
  .town-hero{flex:0 0 auto;min-height:0;}
  .town-location,.town-notice{height:auto;}
}


/* ---------- dungeon selection board ---------- */
.dungeon-board{display:flex;flex-direction:column;gap:14px;color:var(--ink);padding:2px 1px 8px;}
.dungeon-hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;border-bottom:1px solid rgba(58,40,18,.35);padding:2px 2px 10px;}
.dungeon-kicker{font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:#765018;font-weight:700;}
.dungeon-title{margin:3px 0 4px;font-size:22px;font-weight:900;color:#241707;letter-spacing:.5px;}
.dungeon-story{font-size:11px;color:#5b431f;line-height:1.65;}
.dungeon-power{align-self:start;min-width:145px;padding:10px 12px;border:1px solid rgba(91,67,31,.45);background:rgba(255,250,230,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.65);text-align:right;}
.dungeon-power .label{font-family:'Cinzel',serif;font-size:8px;letter-spacing:1.5px;color:#765018;}
.dungeon-power strong{display:block;margin-top:3px;font-family:'Cinzel',serif;font-size:17px;color:#2d1d09;}
.dungeon-power .current{color:#3d6a3a;}
.dungeon-intro{font-size:12px;font-weight:800;color:#3a2812;display:flex;align-items:center;gap:7px;}
.dungeon-intro::before{content:'⚔';font-size:16px;color:#8a5a12;}
.dungeon-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.dungeon-card{position:relative;overflow:hidden;min-width:0;border:1px solid rgba(91,67,31,.48);background:linear-gradient(150deg,rgba(255,250,229,.94),rgba(215,190,133,.5));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 7px rgba(58,40,18,.10);padding:10px 10px 11px;display:flex;flex-direction:column;}
.dungeon-card::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:#718d45;opacity:.9;}
.dungeon-card.elite::before{background:#72538c;}.dungeon-card.boss::before{background:#9a3d32;}
.dungeon-card.locked{filter:saturate(.55);opacity:.7;}
.dungeon-ribbon{display:inline-flex;align-self:flex-start;margin-top:2px;padding:3px 7px;border:1px solid rgba(70,48,18,.35);background:#5d7434;color:#fff8df;font-family:'Cinzel',serif;font-size:8px;font-weight:700;letter-spacing:.7px;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.elite .dungeon-ribbon{background:#62467a;}.boss .dungeon-ribbon{background:#8e3329;}

/* ---------- action buttons ---------- */
#actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px; flex-shrink: 0;}
.action-btn{
  background:linear-gradient(180deg,var(--wood-lighter) 0%,var(--wood) 60%,var(--panel-alt) 100%);
  border:1px solid #000;outline:1px solid var(--gold-dim);border-radius:4px;
  color:var(--gold-bright);padding:11px 6px;font-family:'Cinzel',serif;font-size:12px;cursor:pointer;
  letter-spacing:0.5px;text-align:center;min-height:46px;display:flex;align-items:center;justify-content:center;
  line-height:1.3;box-shadow:inset 0 1px 0 rgba(255,255,255,0.10), 0 2px 4px rgba(0,0,0,0.4);
  transition:background .15s, outline-color .15s;
}
.action-btn:hover{outline-color:var(--gold);background:linear-gradient(180deg,#84592c,#4a3018 60%,var(--panel-alt) 100%);}
.action-btn:active{transform:translateY(2px);box-shadow:inset 0 1px 4px rgba(0,0,0,0.5);}
.action-btn.empty{visibility:hidden;pointer-events:none;}
.action-btn.danger{outline-color:var(--red-bright);color:#f0b8bc;}
.action-btn.danger:hover{background:linear-gradient(180deg,#6b2530,#3a1015 60%,var(--panel-alt) 100%);}
@media (max-width:520px){
  #actions{grid-template-columns:repeat(2,1fr);}
  .sprite-box{width:72px;height:72px;}
  .sprite-box canvas{width:72px;height:72px;}
}

/* ---------- modal ---------- */
#modalRoot{
  position:fixed;inset:0;background:rgba(8,5,2,0.82);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
#modalRoot.show{display:flex;}
.modal-box{width:100%;max-width:360px;}
.modal-title{
  font-family:'Cinzel',serif;font-size:13px;color:var(--gold-bright);margin-bottom:12px;
  text-align:center;letter-spacing:1px;text-shadow:0 1px 0 #000;
}
.modal-input{
  width:100%;background:var(--parchment);border:1px solid #000;outline:1px solid var(--gold-dim);
  color:var(--ink);font-family:'Noto Serif KR',serif;font-size:13px;padding:9px;margin-bottom:10px;
  border-radius:2px;
}
.modal-actions{display:flex;gap:8px;}
.modal-actions .action-btn{flex:1;min-height:38px;}

/* particles & loader */
.particle-layer{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.p-square{position:absolute;width:6px;height:6px;opacity:0.95;transform:rotate(45deg);}
@keyframes pfly{
  0%{transform:translate(0,0) scale(1) rotate(45deg);opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) scale(0.4) rotate(45deg);opacity:0;}
}
.toast{
  position:fixed;left:50%;top:16px;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--wood-lighter),var(--wood));
  border:1px solid #000;outline:2px solid var(--gold);border-radius:3px;
  color:var(--gold-bright);padding:10px 18px;font-size:11px;z-index:80;font-family:'Cinzel',serif;letter-spacing:0.5px;
  opacity:0;transition:opacity .25s;pointer-events:none;
  box-shadow:0 4px 14px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;}
.loader-overlay {
  position:absolute;inset:0;background:rgba(0,0,0,0.7);z-index:40;
  display:none;align-items:center;justify-content:center;color:var(--gold);font-family:'Cinzel',serif;font-size:14px;
}
.loader-overlay.show{display:flex;}
.spinner {
  width:24px;height:24px;border:3px solid transparent;border-top-color:var(--gold);border-radius:50%;
  animation:spin 1s linear infinite;margin-right:10px;
}
@keyframes spin { 100%{transform:rotate(360deg);} }

/* =====================================================================
   RUMOR EVENT UI — interactive town gossip / quest hook
===================================================================== */
.town-rumor-wrap{position:relative;}
.town-rumor-action{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease;border:1px solid rgba(122,86,27,.28)!important;}
.town-rumor-action:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(74,48,12,.12);background:rgba(255,248,222,.72)!important;}

.rumor-event-note{margin-top:8px;font-size:9px;color:#6d542d;line-height:1.45;}
.rumor-event-badge{display:inline-block;margin-top:8px;padding:3px 7px;border:1px solid rgba(138,90,18,.4);background:rgba(255,239,177,.72);font-size:9px;font-weight:900;color:#704b0e;}

/* =====================================================================

   The quest board lives inside #log, whose background is parchment.
===================================================================== */
.quest-board{display:flex;flex-direction:column;gap:12px;color:#2f2110;}

  const pack=aiStagePack(stageIdx);
  if(pack?.rumor){
    return {...pack.rumor, type:"normal", need:3, questKey:"hunt"};
  }
  return RUMOR_EVENTS[stageIdx] || null;
}
function ensureRumorState(){
  const p=S.player;
  if(!p) return;
  if(!p.rumors) p.rumors={};
  for(let i=0;i<RUMOR_EVENTS.length;i++){
    if(!p.rumors[i]) p.rumors[i]={status:"new"};
  }
}
function getRumorState(stageIdx=S.stageIdx){
  ensureRumorState();
  return S.player?.rumors?.[stageIdx] || {status:"new"};
}
function rumorQuestDef(stageIdx=S.stageIdx){
  const ev=getRumorEvent(stageIdx);
  if(!ev) return null;
  return questDefs(stageIdx).find(q=>q.id===`S${stageIdx+1}_${ev.questKey}`) || null;
}

const QUEST_TEMPLATES = [
  {key:"hunt", icon:"⚔️", title:"주변의 위협", type:"normal", need:3,
   desc:(stageName)=>`${stageName} 주변에 출몰하는 몬스터를 처치하세요.`},

  {key:"boss", icon:"🔥", title:"지역의 지배자", type:"boss", need:1,
   desc:(stageName)=>`${stageName}을(를) 지배하는 보스를 쓰러뜨려 다음 지역의 길을 여세요.`}
];

function questDefs(stageIdx=S.stageIdx){
  const [stageName,,,bossList]=STAGE_DATA[stageIdx]||["미지의 지역",[],[],["미지의 보스"]];
  const s=stageIdx+1;
  const pack=aiStagePack(stageIdx);
  if(pack?.quests?.length){
    return pack.quests.map(q=>({
      id:`S${s}_${q.type}`,
      stage:stageIdx,
      icon:q.type==="normal"?"⚔️":q.type==="elite"?"💀":"🔥",
      title:`${q.title} · ${stageName}`,
      desc:q.desc,
      type:q.type,
      target:q.target || (q.type==="boss"?bossList[0]:null),
      need:q.need,
      rumorLinked:!!q.rumorLinked,
      reward:q.reward || rewardForQuestType(stageIdx,q.type)
    }));
  }
  const rumor=getRumorEvent(stageIdx);
  return QUEST_TEMPLATES.map(t=>{
    const linked=rumor&&rumor.questKey===t.key?rumor:null;
    return {
      id:`S${s}_${t.key}`,stage:stageIdx,icon:t.icon,
      title:linked?`${linked.title} · ${stageName}`:`${t.title} · ${stageName}`,
      desc:linked?linked.objective:t.desc(stageName),type:t.type,
      target:linked?linked.target:(t.type==="boss"?bossList[0]:null),
      need:linked?linked.need:t.need,rumorLinked:!!linked,
      reward:rewardForQuestType(stageIdx,t.type)
    };
  });
}

function ensureQuestState(){
  const p=S.player;
  if(!p) return;
  if(!p.quests) p.quests={};
  questDefs().forEach(q=>{
    if(!p.quests[q.id]) p.quests[q.id]={status:"available",progress:0};
  });
}

function allQuestDefs(){
  const list=[];
  for(let i=0;i<STAGE_DATA.length;i++) list.push(...questDefs(i));
  return list;
}

function getQuestState(q){
  ensureQuestState();
  return S.player.quests[q.id] || {status:"available",progress:0};
}

function questRewardText(r){
  return `✨ ${r.exp} EXP  ·  💰 ${r.gold}G  ·  🧪 소형 포션 ${r.potions}개`;
}

function acceptRumorQuest(id,stageIdx=S.stageIdx){

function renderQuestCard(q){
  const st=getQuestState(q);
  const progress=Math.min(q.need,st.progress||0);
  const pct=Math.floor(progress/q.need*100);
  let status="미수주", cls="";
  if(st.status==="active"){status="진행 중";cls="active";}
  if(st.status==="complete"){status="보상 대기";cls="complete";}
  if(st.status==="claimed"){status="완료";cls="complete";}
  return `<div class="quest-card ${cls}">
    <div class="quest-row"><div class="quest-icon">${q.icon}</div><div class="quest-main">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;"><div class="quest-name">${q.title}</div><span class="quest-status ${cls}">${status}</span></div>
      <div class="quest-desc">${q.desc}</div>
      <div class="quest-progress"><span style="width:${pct}%"></span></div>
      <div class="quest-progress-text"><span>진행도</span><b>${progress} / ${q.need}</b></div>
      <div class="quest-reward">보상 · ${questRewardText(q.reward)}${q.rumorLinked ? ` · 📜 마을 소식에서 발견` : ""}</div>
    </div></div></div>`;
}

function acceptQuest(id){
  ensureQuestState();
  const p=S.player;
  const active=Object.values(p.quests).filter(q=>q.status==="active").length;
  if(active>=3){ displayText("⚠️ 동시에 진행할 수 있는 의뢰는 최대 3개입니다."); return; }
  const q=allQuestDefs().find(x=>x.id===id);
  if(!q) return;
  p.quests[id]={status:"active",progress:0};
  autoSave();
  displayText(`📜 [${q.title}] 의뢰를 수주했습니다.`,{highlight:true});
  questMenu();
}

function updateQuestProgress(m){
  ensureQuestState();
  const defs=allQuestDefs();
  const p=S.player;
  let changed=false;
  defs.forEach(q=>{
    const st=p.quests[q.id];
    if(!st || st.status!=="active" || q.stage!==S.stageIdx) return;
    let match=false;
    if(q.type==="normal") match=m.m_type==="일반";
    else if(q.type==="elite") match=m.m_type==="중간보스";
    else if(q.type==="boss") match=m.m_type==="보스" && m.name===q.target;
    if(match && q.rumorLinked && q.target) match = m.name===q.target;
    if(match){
      st.progress=Math.min(q.need,(st.progress||0)+1);
      changed=true;
      if(st.progress>=q.need){
        st.status="complete";
        if(q.rumorLinked && p.rumors) p.rumors[q.stage]={status:"complete"};
      }
    }
  });
  if(changed) autoSave();
  return changed;
}

function claimQuest(id){
  ensureQuestState();
  const q=allQuestDefs().find(x=>x.id===id), st=S.player.quests[id];
  if(!q || !st || st.status!=="complete") return;
  const p=S.player, r=q.reward;
  p.exp += r.exp;
  p.gold += r.gold;
  p.inventory["힐링포션(소)"]=(p.inventory["힐링포션(소)"]||0)+r.potions;
  st.status="claimed";
  if(q.rumorLinked && p.rumors) p.rumors[q.stage]={status:"claimed"};
  autoSave();
  goldFlash();
  displayText(`🎉 퀘스트 완료! [${q.title}]`,{highlight:true});
  displayText(`보상 획득: ${questRewardText(r)}`);
  levelUp(p).then(()=>{autoSave();renderScene();questMenu();});
}

  if(RED_EMOJI.includes(ch)) return "c-red";
  if(GOLD_EMOJI.includes(ch)) return "c-gold";
  if(BLUE_EMOJI.includes(ch)) return "c-blue";

function displayText(text, opts={}){
  const log = logEl();
  if(opts.clear) log.innerHTML = "";
  const wrapper = document.createElement("span");
  wrapper.className = "ln";
  wrapper.style.marginBottom = (S.lineSpacing) + "px";
  wrapper.style.fontSize = S.fontSize + "px";
  if(opts.highlight) wrapper.style.fontWeight = "bold";

  text = text.replace(/==================================================/g, "■━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━■");
  text = text.replace(/--------------------------------------------------/g, "────────────────────────────────────────────────────────");

  const chars = Array.from(text);
  let buf = "";
  const flush = ()=>{ if(buf){ wrapper.appendChild(document.createTextNode(buf)); buf=""; } };
  for(const ch of chars){
    const cls = colorSpanFor(ch);
    if(cls){ flush(); const sp=document.createElement("span"); sp.className=cls; sp.textContent=ch; wrapper.appendChild(sp); }
    else buf += ch;
  }
  flush();
  if(log.childNodes.length>0) log.appendChild(document.createElement("br"));
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
}

function applyTextSettings(){
  const log = logEl();
  if(!log) return;

  const scale = S.fontSize / 13;
  const uiElements = Array.from(log.querySelectorAll('*'));

  uiElements.forEach(el=>{
    if(!el.dataset.baseFontSize){
      const computed = parseFloat(getComputedStyle(el).fontSize);
      if(Number.isFinite(computed)) el.dataset.baseFontSize = String(computed);

  });

  uiElements.forEach(el=>{
    if(el.dataset.baseFontSize){

function setButtons(list){

      b.className = "action-btn" + (opts&&opts.danger ? " danger":"");
      b.textContent = text;

function setPaginatedButtons(btnList, page=0, isEvent=false){
  const perPage = 5;
  const totalPages = Math.max(1, Math.ceil(btnList.length/perPage));
  page = clamp(page, 0, totalPages-1);
  const start = page*perPage;
  const items = btnList.slice(start, start+perPage).map(arr => {
     if(isEvent && arr[0]!=="") return [arr[0], arr[1], {eventCmd:true}];
     return arr;
  });
  if(totalPages>1){
    items.push(page>0 ? ["◀ 이전", ()=>setPaginatedButtons(btnList,page-1,isEvent), {eventCmd:isEvent}] : ["",()=>{}]);
    items.push(page<totalPages-1 ? ["다음 ▶", ()=>setPaginatedButtons(btnList,page+1,isEvent), {eventCmd:isEvent}] : ["",()=>{}]);
  }
  setButtons(items);
}

function validateAIStagePack(raw, stageIdx){
  const allowed=stageAllowedMonsters(stageIdx);
  const allNormal=allowed.normalList;
  const allElite=allowed.eliteList;
  const boss=allowed.bossList[0];
  const source=raw && typeof raw==="object" ? raw : {};

  const rumor=source.rumor && typeof source.rumor==="object" ? source.rumor : {};
  const quests=Array.isArray(source.quests) ? source.quests : [];
  const events=Array.isArray(source.events) ? source.events : [];

  const fallbackRumor=getRumorEvent(stageIdx) || RUMOR_EVENTS[stageIdx] || {title:"수상한 소문",kicker:"FIELD REPORT",story:"주민들 사이에서 수상한 소문이 돌고 있습니다.",objective:"주변을 조사하세요.",target:allNormal[0]||boss,type:"normal",need:3,questKey:"hunt"};
  const normalizedRumor={
    title:String(rumor.title||fallbackRumor.title).slice(0,80),
    kicker:String(rumor.kicker||fallbackRumor.kicker).slice(0,80),
    story:String(rumor.story||fallbackRumor.story).slice(0,500),
    objective:String(rumor.objective||fallbackRumor.objective).slice(0,240),
    target:allNormal.includes(rumor.target) ? rumor.target : (allNormal[0]||boss),
    type:"normal", need:3, questKey:"hunt"
  };

  const fallbackQuestByType={
    normal:{title:"주변의 위협",desc:`${allowed.stageName} 주변에 출몰하는 몬스터를 처치하세요.`,target:allNormal[0]||boss,need:3},
    elite:{title:"위험한 사냥감",desc:`${allowed.stageName}의 정예 몬스터를 처치하고 주민들을 안심시키세요.`,target:allElite[0]||boss,need:1},
    boss:{title:"지역의 지배자",desc:`${allowed.stageName}을(를) 지배하는 보스를 쓰러뜨려 다음 지역의 길을 여세요.`,target:boss,need:1}
  };
  const byType={};
  quests.forEach(q=>{ if(q && ["normal","elite","boss"].includes(q.type) && !byType[q.type]) byType[q.type]=q; });
  byType.normal = byType.normal || {};
  if(normalizedRumor) byType.normal = {...byType.normal, rumorLinked:true};

  const outQuests=["normal","elite","boss"].map(type=>{
    const q=byType[type]||{};
    const fb=fallbackQuestByType[type];
    const allowedTargets=type==="normal"?allNormal:type==="elite"?allElite:[boss];
    const target=allowedTargets.includes(q.target) ? q.target : (type==="normal" && normalizedRumor.target ? normalizedRumor.target : fb.target);
    const linked=type==="normal";
    const title=linked ? normalizedRumor.title : String(q.title||fb.title).slice(0,80);
    const desc=linked ? normalizedRumor.objective : String(q.description||q.desc||fb.desc).slice(0,240);
    const need=type==="normal" ? 3 : type==="elite" ? 1 : 1;
    return {type,title,desc,target,need,rumorLinked:linked,reward:rewardForQuestType(stageIdx,type)};
  });

  const normalizedEvents=events.slice(0,5).map((ev,i)=>{
    const choices=Array.isArray(ev?.choices)?ev.choices:[];
    const safeChoices=choices.slice(0,3).map((c,j)=>({
      text:String(c?.text||(["도와준다","상황을 지켜본다","지나쳐 간다"][j]||"선택한다")).slice(0,100),
      karma_change:safeKarma(c?.karma_change),
      type:safeChoiceType(c?.type),
      reward_tier:["small","medium","none"].includes(c?.reward_tier)?c.reward_tier:"none"
    }));
    while(safeChoices.length<3) safeChoices.push({text:"지나쳐 간다",karma_change:0,type:"none",reward_tier:"none"});
    return {story:String(ev?.story||"길을 걷던 중 수상한 기척이 느껴집니다.").slice(0,500),choices:safeChoices};
  });

  return {version:AI_CONTENT_VERSION,stage:stageIdx,generatedAt:Date.now(),rumor:normalizedRumor,quests:outQuests,events:normalizedEvents};
}

async function generateAIStagePack(stageIdx=S.stageIdx){
  const p=S.player;
  const allowed=stageAllowedMonsters(stageIdx);
  const karmaDesc=p.karma>=65?"선한 성향":(p.karma<=35?"악한 성향":"중립 성향");
  const prompt=`당신은 DARK ABYSS 판타지 텍스트 RPG의 지역 콘텐츠 작가입니다.
이번 호출에서는 STAGE ${stageIdx+1}의 콘텐츠를 한 번에 묶어서 생성합니다.
중요: 보상 수치, 몬스터 능력치, 전투 결과는 생성하지 마세요. 실제 게임 엔진이 결정합니다.
플레이어: 레벨 ${p.level}, 직업 ${p.current_job}, Karma ${p.karma} (${karmaDesc})
지역: ${allowed.stageName}
일반 몬스터 후보: ${JSON.stringify(allowed.normalList)}
정예 몬스터 후보: ${JSON.stringify(allowed.eliteList)}
보스 후보: ${JSON.stringify(allowed.bossList)}

반드시 순수 JSON 하나만 반환하세요.
형식:
{
  "rumor":{"title":"...","kicker":"FIELD REPORT · ...","story":"2~3문장","objective":"...","target":"일반 몬스터 후보 중 1개"},
  "quests":[
    {"type":"normal","title":"...","description":"...","target":"일반 몬스터 후보 중 1개"},
    {"type":"elite","title":"...","description":"...","target":"정예 몬스터 후보 중 1개"},
    {"type":"boss","title":"...","description":"...","target":"보스 후보의 첫 번째 이름"}
  ],
  "events":[
    {"story":"2~3문장","choices":[
      {"text":"...","karma_change":10,"type":"reward","reward_tier":"small"},
      {"text":"...","karma_change":-10,"type":"battle","reward_tier":"none"},
      {"text":"...","karma_change":0,"type":"none","reward_tier":"none"}
    ]}
  ]
}
이벤트는 5개 이하로 생성하세요. reward_tier는 small/medium/none 중 하나이며 실제 골드 금액은 절대 쓰지 마세요.`;

  const res=await fetch(`/api/gemini`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
  if(!res.ok) throw new Error(`AI HTTP ${res.status}`);
  const data=await res.json();
  if(!data.candidates?.[0]?.content?.parts?.[0]?.text) throw new Error("API 응답 형식 오류");
  return validateAIStagePack(JSON.parse(cleanAIJson(data.candidates[0].content.parts[0].text)),stageIdx);
}

async function ensureAIStageContent(stageIdx=S.stageIdx, options={}){
  if(aiStagePack(stageIdx)) return aiStagePack(stageIdx);
  if(!S.aiContent.stages) S.aiContent.stages={};
  if(S.aiContent._loading?.[stageIdx]) return S.aiContent._loading[stageIdx];

  if(!S.aiContent._loading) S.aiContent._loading={};
  const run=(async()=>{
    try{
      if(options.showLoader){ aiLoader().classList.add("show"); toast("지역 콘텐츠를 준비하는 중..."); }
      const pack=await generateAIStagePack(stageIdx);
      S.aiContent.stages[stageIdx]=pack;
      delete S.aiContent._loading[stageIdx];
      autoSave();
      return pack;
    }catch(e){
      console.warn("AI stage pack generation failed",e);
      delete S.aiContent._loading[stageIdx];
      return null;
    }finally{
      if(options.showLoader) aiLoader().classList.remove("show");
    }
  })();
  S.aiContent._loading[stageIdx]=run;
  return run;
}

function getCachedEvent(){
  const pack=aiStagePack(S.stageIdx);
  if(!pack || !Array.isArray(pack.events) || !pack.events.length) return null;
  if(!pack._eventQueue || !pack._eventQueue.length){
    pack._eventQueue=pack.events.map((_,i)=>i).sort(()=>Math.random()-0.5);
  }
  const idx=pack._eventQueue.shift();
  return pack.events[idx] || null;
}

function eventRewardGold(tier,stageIdx=S.stageIdx){
  const s=stageIdx+1;
  if(tier==="medium") return randInt(90+s*20,150+s*30);
  if(tier==="small") return randInt(45+s*10,80+s*15);
  return 0;
}

/* =====================================================================
   CACHED AI RANDOM EVENT — NO API CALL DURING DUNGEON PLAY
===================================================================== */
async function triggerRandomEvent(locationStr, callback) {
  if(Math.random()>0.3) return callback();

  let eventData=getCachedEvent();
  if(!eventData){
    return callback();
  }

  S.isEvent=true;
  setButtons([]);
  displayText(`\n🔮 안개 속에서 미지의 기운이 느껴집니다...`);
  aiLoader().classList.remove("show");
  displayText(`\n📜 [돌발 이벤트]`,{highlight:true,clear:true});
  displayText(eventData.story);

  const btns=eventData.choices.map(c=>[
    c.text,
    ()=>resolveEvent(c,callback)
  ]);
  setPaginatedButtons(btns,0,true);
}

async function resolveEvent(choice, callback) {
  setButtons([]);
  const p=S.player;
  const karmaChange=safeKarma(choice.karma_change);
  p.karma=clamp(p.karma+karmaChange,0,100);

  displayText(`\n▶ [당신의 선택] ${choice.text}`,{highlight:true});
  if(choice.type==="reward"){
    const g=eventRewardGold(choice.reward_tier,S.stageIdx);
    if(g>0){ p.gold+=g; displayText(`▶ 도움의 대가로 💰 ${g}G를 획득했습니다!`); }
    else displayText("▶ 작은 기회를 얻었지만 특별한 보상은 없습니다.");
  }else if(choice.type==="battle"){
    displayText("▶ 전투가 시작됩니다!");
  }else{
    displayText("▶ 아무 일도 일어나지 않고 지나갑니다.");
  }

  if(karmaChange>0) displayText(`👼 선향 수치가 증가했습니다! (현재 ${p.karma})`);
  else if(karmaChange<0) displayText(`👿 악향 수치가 감소했습니다! (현재 ${p.karma})`);

  autoSave();
  await wait(1200);
  S.isEvent=false;
  if(choice.type==="reward") town();
  else callback();
}

function drawSprite(canvas, matrix, palette){
  const rows = matrix.length, cols = matrix[0].length;
  canvas.width = cols; canvas.height = rows;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,cols,rows);
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const ch = matrix[r][c];
      if(ch===" ") continue;
      ctx.fillStyle = palette[ch] || "#ffffff";
      ctx.fillRect(c,r,1,1);
    }
  }
}
